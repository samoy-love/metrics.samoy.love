# Мониторинг samoy.love: Prometheus + Grafana + экспортёры.
#
# Разворачивается в /opt/samoylove-metrics на одном сервере (Oracle Ampere,
# aarch64). Все образы закреплены по версии: «latest» на arm64 периодически
# уезжает вперёд остальных архитектур, и обновление, которого никто не просил,
# ломало бы мониторинг ровно тогда, когда он нужен.
#
# ВЕРСИЯ И DIGEST ВМЕСТЕ. Тег мутабелен: v3.13.2 можно перезалить, и `docker
# compose pull` молча привёз бы другой образ под тем же именем — «закреплено
# по версии» перестаёт быть правдой в момент, когда это важнее всего. Digest
# закрепляет содержимое; тег рядом с ним оставлен для человека, чтобы версия
# читалась глазами (и чтобы CI мог достать её оттуда для promtool).
#
# Обновление образа — правка обеих частей строки. Digest берётся так:
#   docker buildx imagetools inspect <образ>:<тег> --format '{{.Manifest.Digest}}'
# Это digest СПИСКА манифестов (multi-arch), поэтому одна строка одинаково
# верна и для arm64 сервера, и для amd64 раннера CI.
#
# Наружу не публикуется НИЧЕГО. Порты биндятся на 127.0.0.1, снаружи доступ
# идёт только через nginx (metrics.samoy.love) под basic-auth.

name: samoylove-metrics

services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: samoylove-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 дней истории при таком количестве целей — это единицы гигабайт;
      # ограничение по размеру стоит вторым рубежом, чтобы TSDB не смогла
      # выесть диск, если целей вдруг станет сильно больше.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=8GB
      # Prometheus отдаётся по подпути /prometheus/ того же домена, поэтому
      # ему нужно знать свой внешний адрес — иначе его редиректы и ссылки
      # в UI будут вести на корень, то есть в Grafana.
      - --web.external-url=https://metrics.samoy.love/prometheus/
      # Включает POST на /-/reload и /-/quit. Ручка нужна: перечитывание
      # конфига без рестарта описано в README и делается С ХОСТА, curl'ом на
      # 127.0.0.1:9090 по SSH.
      #
      # Снаружи она закрыта не здесь, а в nginx: location ^~ /prometheus/-/ в
      # deploy-kit/nginx/sites/metrics.samoy.love.conf отдаёт 404 на всё, кроме
      # /-/healthy и /-/ready. Иначе любой, кто знает общий пароль basic-auth,
      # мог бы одним запросом остановить сбор метрик — basic-auth здесь один
      # на всю панель и правами не разграничивает.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Цели вроде snakes слушают на хосте, а не в этой сети.
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: samoylove-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file:
      # Пароль администратора и токен телеграм-бота лежат ТОЛЬКО на сервере, в
      # репозитории их нет. Файл создаётся server/bootstrap.sh при первой
      # установке.
      #
      # Путь абсолютный и намеренно ведёт РЯДОМ с каталогом релизов, а не
      # внутрь него: стек катится через deploy-kit, и compose-файл работает из
      # /opt/samoylove-metrics/current/, который меняется с каждой выкаткой.
      # Относительный `.env` пришлось бы класть в артефакт — то есть возить
      # секреты через сборку и хранить их в пяти копиях по releases/.
      - /opt/samoylove-metrics/.env
    environment:
      GF_SERVER_ROOT_URL: https://metrics.samoy.love/
      # Снаружи стоит basic-auth nginx, но собственную форму логина Grafana
      # оставляем: два независимых рубежа дешевле, чем разбираться потом,
      # почему открытая панель оказалась открытой для всех.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Алертинг теперь целиком в Grafana (grafana/provisioning/alerting):
      # правила, маршрутизация и доставка в Telegram. Отдельный Alertmanager
      # убран из стека — Grafana несёт встроенный, второй конфигурировать
      # смысла не было. Токен бота контактная точка читает из переменной
      # TELEGRAM_BOT_TOKEN — она приходит из .env выше, тем же путём, что
      # раньше шла к Alertmanager.
      #
      # Скриншот графика к алерту: рендерит соседний контейнер, Grafana только
      # просит и вкладывает результат в сообщение.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3000 и 3001 на этом хосте уже заняты openspeedtest.
      - "127.0.0.1:3002:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    logging: *default-logging

  renderer:
    # Рендерит график в PNG по запросу Grafana — только это, из сети наружу не
    # достаёт и снаружи недоступен. Нужен исключительно ради скриншота к
    # алерту (see GF_RENDERING_* выше); без него Grafana просто не приложит
    # картинку и пришлёт текстовое сообщение, как раньше.
    image: grafana/grafana-image-renderer:v5.12.0@sha256:7fcea1db9aef1428f18bb820ec9e7ae4e25a430679b9fa8e08d56f2195424234
    container_name: samoylove-renderer
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
    deploy:
      resources:
        limits:
          # Headless Chromium под капотом — тяжелее, чем кажется по задаче.
          cpus: "1.0"
          memory: 512m
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: samoylove-node-exporter
    restart: unless-stopped
    pid: host
    # Сбор состояния systemd-юнитов идёт через системную шину dbus, а профиль
    # AppArmor по умолчанию запрещает контейнеру с ней разговаривать
    # («An AppArmor policy prevents this sender...»), и коллектор systemd
    # молча отдаёт ноль метрик. Контейнер при этом монтирует хост только
    # на чтение и своих портов наружу не имеет.
    #
    # apparmor=unconfined снять нельзя, но можно убрать всё остальное, что
    # делало этот контейнер самым привилегированным в стеке. Экспортёр только
    # читает: ни одной привилегии ему не нужно, повышать их он тоже не должен.
    # Процесс в образе и так идёт от nobody, поэтому обе строки ничего не
    # ломают — они закрывают путь наверх, если однажды сломается что-то ещё.
    security_opt:
      - apparmor=unconfined
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --path.rootfs=/host
      # Textfile-коллектор: сюда кладут .prom процессы, которым нечем слушать
      # порт. Агент статус-страницы — oneshot по таймеру (между запусками его
      # просто нет), телеграм-бот принципиально никуда не слушает. Файл решает
      # обе задачи и ничего не открывает наружу.
      - --collector.textfile
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile
      - --collector.systemd
      - --collector.systemd.unit-include=(snakes|snakes-backup-profiles|chillhub-api|chillhub-admin|chillhub-backup|status-agent|nginx|docker)\.service
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --no-collector.wifi
      - --no-collector.hwmon
    volumes:
      - /:/host:ro,rslave
      - /run/systemd:/run/systemd:ro
      # В образе node_exporter нет симлинка /var/run -> /run, а сам экспортёр
      # ищет шину именно по /var/run/dbus/... Монтируем сразу по нужному пути.
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

  nginxlog-exporter:
    # Посещаемость всех пяти сайтов домена и события их интерфейсов — из
    # журналов nginx. Читаются ДВА отдельных журнала: samoylove_metrics.log
    # (просмотры) и samoylove_events.log (нажатия). Разделены потому, что
    # события, попав в счётчик просмотров, раздули бы посещаемость и стали бы
    # от неё неотличимы.
    #
    # Ни в одном из них нет ни IP, ни User-Agent, ни cookie, ни строки
    # запроса — их нет в самом log_format. Считается, ЧТО произошло, а не КТО
    # это сделал: см. nginxlog/nginxlog.yml и deploy-kit/nginx/conf.d.
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0@sha256:b36976cb58584529381a92404a7ba9868b03e1a321c9dc7228cc9ecd93a80440
    container_name: samoylove-nginxlog
    restart: unless-stopped
    command:
      - -config-file=/etc/nginxlog/nginxlog.yml
    volumes:
      - ./nginxlog/nginxlog.yml:/etc/nginxlog/nginxlog.yml:ro
      # Только чтение и только каталог журналов. Ротацию делает logrotate
      # хоста; экспортёр умеет переоткрывать файл сам.
      - /var/log/nginx:/var/log/nginx:ro
    # Портов наружу нет: Prometheus ходит по имени сервиса внутри сети.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: samoylove-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    dns:
      # Пробы ходят на публичные адреса сайтов, то есть наружу и обратно.
      # Системный resolver внутри контейнера указывает на 127.0.0.53 хоста,
      # которого в сетевом namespace контейнера нет.
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

volumes:
  # Именованные тома, а не bind-каталоги: история должна пережить полное
  # пересоздание контейнеров (docker compose down/up), в том числе с заменой
  # версии образа.
  prometheus-data:
  grafana-data:
