# rule_uid is replaced with the actual Grafana A.expr by render-alert-tests.py.
# Gauges come from render_history windows, not increments of the jobs queue.
evaluation_interval: 1m
tests:
  - name: Night delivery backlog is not a stalled worker
    interval: 1m
    input_series:
      - series: 'cs2_worker_last_success_timestamp_seconds{worker="доставка"}'
        values: '1+0x420'
      - series: 'cs2_worker_backlog{worker="доставка"}'
        values: '3+0x420'
      - series: 'cs2_worker_enabled{worker="доставка"}'
        values: '1+0x420'
      - series: 'cs2_chain_waiting_seconds{stage="разобран"}'
        values: '0+0x420'
    promql_expr_test:
      - rule_uid: cs2-worker-silent
        eval_time: 7h
        exp_samples: []
      - rule_uid: cs2-chain-waiting
        eval_time: 7h
        exp_samples: []
    alert_rule_test:
      - eval_time: 7h
        alertname: cs2-worker-silent
        exp_alerts: []

  - name: A stalled code worker still alerts
    interval: 1m
    input_series:
      - series: 'cs2_worker_last_success_timestamp_seconds{worker="коды"}'
        values: '1+0x420'
      - series: 'cs2_worker_backlog{worker="коды"}'
        values: '5+0x420'
      - series: 'cs2_worker_enabled{worker="коды"}'
        values: '1+0x420'
    promql_expr_test:
      - rule_uid: cs2-worker-silent
        eval_time: 7h
        exp_samples:
          - labels: '{worker="коды"}'
            value: 25199
    alert_rule_test:
      - eval_time: 7h
        alertname: cs2-worker-silent
        exp_alerts:
          - exp_labels: {worker: коды, severity: warning, area: cs2}

  - name: Overdue delivery still alerts after the hold period
    interval: 1m
    input_series:
      - series: 'cs2_chain_waiting_seconds{stage="разобран"}'
        values: '0+0x59 7500+0x35'
    promql_expr_test:
      - rule_uid: cs2-chain-waiting
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 7500
    alert_rule_test:
      - eval_time: 89m
        alertname: cs2-chain-waiting
        exp_alerts: []
      - eval_time: 90m
        alertname: cs2-chain-waiting
        exp_alerts:
          - exp_labels: {severity: warning, area: cs2}

  - name: A healthy collection cycle must not hide stale profile data
    interval: 1m
    input_series:
      - series: cs2_steam_profiles_stale
        values: '241+0x360'
      - series: 'cs2_worker_last_success_timestamp_seconds{worker="профили"}'
        values: '0+60x360'
    promql_expr_test:
      - rule_uid: cs2-profiles-stale
        eval_time: 6h
        exp_samples:
          - labels: cs2_steam_profiles_stale
            value: 241
    alert_rule_test:
      - eval_time: 6h
        alertname: cs2-profiles-stale
        exp_alerts:
          - exp_labels: {severity: warning, area: cs2}

  - name: Diagnostic failures must not page for user or system orders
    interval: 1m
    input_series:
      - series: 'cs2_chain_scrape_up'
        values: '1+0x15'
      - series: 'cs2_render_failed_window{engine="linux",requester="user",window="1h"}'
        values: '2+0x15'
      - series: 'cs2_render_failed_window{engine="linux",requester="system",window="1h"}'
        values: '0+0x15'
      - series: 'cs2_render_failed_window{engine="linux",requester="diagnostic",window="1h"}'
        values: '100+0x15'
    promql_expr_test:
      - rule_uid: cs2-render-failed
        eval_time: 15m
        exp_samples: []
    alert_rule_test:
      - eval_time: 15m
        alertname: cs2-render-failed
        exp_alerts: []

  - name: Old cumulative failures in render_jobs must not count
    interval: 1m
    input_series:
      - series: 'cs2_chain_scrape_up'
        values: '1+0x15'
      - series: 'cs2_render_jobs{engine="hlae",state="failed"}'
        values: '900+0x15'
      - series: 'cs2_render_failed_window{engine="hlae",requester="user",window="1h"}'
        values: '0+0x15'
    promql_expr_test:
      - rule_uid: cs2-render-failed
        eval_time: 15m
        exp_samples: []

  - name: Three history failures for real orders trigger after ten minutes
    interval: 1m
    input_series:
      - series: 'cs2_chain_scrape_up'
        values: '1+0x15'
      - series: 'cs2_render_failed_window{engine="hlae",requester="user",window="1h"}'
        values: '2+0x15'
      - series: 'cs2_render_failed_window{engine="hlae",requester="system",window="1h"}'
        values: '1+0x15'
      - series: 'cs2_render_failed_window{engine="linux",requester="user",window="1h"}'
        values: '1+0x15'
    promql_expr_test:
      - rule_uid: cs2-render-failed
        eval_time: 10m
        exp_samples:
          - labels: '{engine="hlae"}'
            value: 3
    alert_rule_test:
      - eval_time: 9m
        alertname: cs2-render-failed
        exp_alerts: []
      - eval_time: 10m
        alertname: cs2-render-failed
        exp_alerts:
          - exp_labels: {engine: hlae, severity: warning, area: cs2}

  - name: Failed history scrape must not reuse its last failure gauge
    interval: 1m
    input_series:
      - series: 'cs2_chain_scrape_up'
        values: '0+0x15'
      - series: 'cs2_render_failed_window{engine="linux",requester="user",window="1h"}'
        values: '3+0x15'
    promql_expr_test:
      - rule_uid: cs2-render-failed
        eval_time: 15m
        exp_samples: []

  - name: Missing free space alerts only for a live engine
    interval: 1m
    input_series:
      - series: 'cs2_render_heartbeat_age_seconds{engine="linux"}'
        values: '60+0x10'
      - series: 'cs2_render_heartbeat_age_seconds{engine="hlae"}'
        values: '240+0x10'
    promql_expr_test:
      - rule_uid: cs2-render-disk-unknown
        eval_time: 5m
        exp_samples:
          - labels: 'cs2_render_heartbeat_age_seconds{engine="linux"}'
            value: 60
    alert_rule_test:
      - eval_time: 4m
        alertname: cs2-render-disk-unknown
        exp_alerts: []
      - eval_time: 5m
        alertname: cs2-render-disk-unknown
        exp_alerts:
          - exp_labels: {engine: linux, severity: warning, area: cs2}

  - name: Zero free bytes is known but low and must alert
    interval: 1m
    input_series:
      - series: 'cs2_render_heartbeat_age_seconds{engine="hlae"}'
        values: '45+0x15'
      - series: 'cs2_render_clips_free_bytes{engine="hlae"}'
        values: '0+0x15'
    promql_expr_test:
      - rule_uid: cs2-render-disk-unknown
        eval_time: 10m
        exp_samples: []
      - rule_uid: cs2-render-disk-low
        eval_time: 10m
        exp_samples:
          - labels: 'cs2_render_clips_free_bytes{engine="hlae"}'
            value: 0
    alert_rule_test:
      - eval_time: 9m
        alertname: cs2-render-disk-low
        exp_alerts: []
      - eval_time: 10m
        alertname: cs2-render-disk-low
        exp_alerts:
          - exp_labels: {engine: hlae, severity: warning, area: cs2}

  - name: Healthy disks produce neither missing nor low alerts
    interval: 1m
    input_series:
      - series: 'cs2_render_heartbeat_age_seconds{engine="linux"}'
        values: '30+0x15'
      - series: 'cs2_render_clips_free_bytes{engine="linux"}'
        values: '21474836480+0x15'
    promql_expr_test:
      - rule_uid: cs2-render-disk-unknown
        eval_time: 15m
        exp_samples: []
      - rule_uid: cs2-render-disk-low
        eval_time: 15m
        exp_samples: []

  - name: Diagnostic first try ratio cannot trigger production alert
    interval: 1m
    input_series:
      - series: 'cs2_render_first_try_by_requester_ratio{engine="linux",requester="diagnostic"}'
        values: '0+0x1440'
      - series: 'cs2_render_first_try_by_requester_ratio{engine="linux",requester="user"}'
        values: '0.95+0x1440'
      - series: 'cs2_render_first_try_by_requester_ratio{engine="hlae",requester="system"}'
        values: '1+0x1440'
      - series: 'cs2_render_first_try_ratio{engine="linux"}'
        values: '0.3+0x1440'
    promql_expr_test:
      - rule_uid: cs2-render-first-try-low
        eval_time: 24h
        exp_samples: []
    alert_rule_test:
      - eval_time: 24h
        alertname: cs2-render-first-try-low
        exp_alerts: []

  - name: Low first try ratio for a real requester must persist for a day
    interval: 1m
    input_series:
    - series: cs2_render_first_try_by_requester_ratio{engine="hlae",requester="user"}
      values: 0.8+0x1440
    - series: cs2_render_first_try_by_requester_ratio{engine="linux",requester="system"}
      values: 0.7+0x1440
    - series: cs2_render_first_try_by_requester_ratio{engine="linux",requester="user"}
      values: 0.9+0x1440
    - series: cs2_render_finished_window{engine="hlae",requester="user",product="clip",result="done",window="24h"}
      values: 10+0x1440
    - series: cs2_render_finished_window{engine="linux",requester="system",product="clip",result="done",window="24h"}
      values: 10+0x1440
    - series: cs2_render_finished_window{engine="linux",requester="user",product="clip",result="done",window="24h"}
      values: 10+0x1440
    - series: cs2_chain_scrape_up
      values: 1+0x1440
    promql_expr_test:
    - rule_uid: cs2-render-first-try-low
      eval_time: 24h
      exp_samples:
      - labels: cs2_render_first_try_by_requester_ratio{engine="hlae",requester="user"}
        value: 0.8
      - labels: cs2_render_first_try_by_requester_ratio{engine="linux",requester="system"}
        value: 0.7
    alert_rule_test:
    - eval_time: 23h59m
      alertname: cs2-render-first-try-low
      exp_alerts: []
    - eval_time: 24h
      alertname: cs2-render-first-try-low
      exp_alerts:
      - exp_labels:
          engine: hlae
          requester: user
          severity: warning
          area: cs2
      - exp_labels:
          engine: linux
          requester: system
          severity: warning
          area: cs2

  - name: Isolated cgroup pressure with plenty of host memory does not alert
    interval: 1m
    input_series:
      - series: node_pressure_memory_stalled_seconds_total{job="node-host",instance="host"}
        values: 0+30x40
      - series: node_memory_MemTotal_bytes{job="node-host",instance="host"}
        values: 1000+0x40
      - series: incus_cgroup_memory_stall_seconds_total{name="ci-light",kind="full"}
        values: 0+30x40
      - series: node_memory_MemAvailable_bytes{job="node-host",instance="host"}
        values: 500+0x40
    promql_expr_test:
      - rule_uid: hw-memory-pressure
        eval_time: 30m
        exp_samples: []
  - name: A busy runner must not hide real host memory exhaustion
    interval: 1m
    input_series:
      - series: node_pressure_memory_stalled_seconds_total{job="node-host",instance="host"}
        values: 0+30x40
      - series: node_memory_MemTotal_bytes{job="node-host",instance="host"}
        values: 1000+0x40
      - series: incus_cgroup_memory_stall_seconds_total{name="ci-light",kind="full"}
        values: 0+30x40
      - series: node_memory_MemAvailable_bytes{job="node-host",instance="host"}
        values: 50+0x40
    promql_expr_test:
      - rule_uid: hw-memory-pressure
        eval_time: 30m
        exp_samples:
          - labels: '{job="node-host",instance="host"}'
            value: 0.5
  - name: Disk warning precedes the existing critical threshold
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="node",instance="web",mountpoint="/"}
        values: 12000000000+0x40
      - series: node_filesystem_size_bytes{job="node",instance="web",mountpoint="/"}
        values: 100000000000+0x40
    promql_expr_test:
      - rule_uid: hw-root-space-warning
        eval_time: 30m
        exp_samples:
          - labels: '{job="node",instance="web",mountpoint="/"}'
            value: 0.12
  - name: Critical disk threshold suppresses duplicate warning
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="node",instance="web",mountpoint="/"}
        values: 9000000000+0x40
      - series: node_filesystem_size_bytes{job="node",instance="web",mountpoint="/"}
        values: 100000000000+0x40
    promql_expr_test:
      - rule_uid: hw-root-space-warning
        eval_time: 30m
        exp_samples: []
  - name: Absolute space threshold avoids warning on large healthy disks
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{job="node",instance="web",mountpoint="/"}
        values: 120000000000+0x40
      - series: node_filesystem_size_bytes{job="node",instance="web",mountpoint="/"}
        values: 1000000000000+0x40
    promql_expr_test:
      - rule_uid: hw-root-space-warning
        eval_time: 30m
        exp_samples: []
  - name: Windows system disk is checked separately from clips
    interval: 1m
    input_series:
      - series: windows_logical_disk_free_bytes{job="cs2-win",volume="C:"}
        values: 10000000000+0x40
      - series: windows_logical_disk_size_bytes{job="cs2-win",volume="C:"}
        values: 150000000000+0x40
    promql_expr_test:
      - rule_uid: hw-win-system-disk-low
        eval_time: 30m
        exp_samples:
          - labels: '{job="cs2-win",volume="C:"}'
            value: 0.06666666666666667
  - name: High working set warns before container OOM
    interval: 1m
    input_series:
      - series: monitoring_container_memory_working_set_bytes{container="grafana"}
        values: 900+0x40
      - series: monitoring_container_memory_limit_bytes{container="grafana"}
        values: 1000+0x40
      - series: monitoring_container_running{container="grafana"}
        values: 1+0x40
    promql_expr_test:
      - rule_uid: mon-container-memory-high
        eval_time: 30m
        exp_samples:
          - labels: '{container="grafana"}'
            value: 0.9
  - name: Stopped container is visible but not zero memory
    interval: 1m
    input_series:
      - series: monitoring_container_running{container="grafana"}
        values: 0+0x40
    promql_expr_test:
      - rule_uid: mon-container-stopped
        eval_time: 30m
        exp_samples:
          - labels: monitoring_container_running{container="grafana"}
            value: 0
      - rule_uid: mon-container-memory-high
        eval_time: 30m
        exp_samples: []
  - name: New container OOM is an incident
    interval: 1m
    input_series:
      - series: monitoring_container_oom_kills_total{container="grafana"}
        values: 0+0x20 1+0x20
    promql_expr_test:
      - rule_uid: mon-container-oom
        eval_time: 30m
        exp_samples:
          - labels: '{container="grafana"}'
            value: 1
  - name: Missing Docker collector is not silently healthy
    interval: 1m
    input_series:
      - series: up{job="node"}
        values: 1+0x40
    promql_expr_test:
      - rule_uid: mon-container-collector-stale
        eval_time: 30m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: Stale Docker collector timestamp is detected
    interval: 1m
    input_series:
      - series: monitoring_containers_collect_timestamp_seconds
        values: 1+0x40
    promql_expr_test:
      - rule_uid: mon-container-collector-stale
        eval_time: 30m
        exp_samples:
          - labels: '{}'
            value: 1799
  - name: Malformed textfile is detected even when exporter responds
    interval: 1m
    input_series:
      - series: node_textfile_scrape_error{job="node"}
        values: 1+0x40
    promql_expr_test:
      - rule_uid: mon-textfile-parse-error
        eval_time: 30m
        exp_samples:
          - labels: node_textfile_scrape_error{job="node"}
            value: 1
  - name: Lazy failed notification counter alerts on its first sample
    interval: 1m
    input_series:
      - series: grafana_alerting_notifications_failed_total{integration="telegram"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x20
    promql_expr_test:
      - rule_uid: mon-notification-failed
        eval_time: 30m
        exp_samples:
          - labels: grafana_alerting_notifications_failed_total{integration="telegram"}
            value: 1
  - name: Failed notification counter reset does not create an error
    interval: 1m
    input_series:
      - series: grafana_alerting_notifications_failed_total{integration="telegram"}
        values: 3+0x20 0+0x20
    promql_expr_test:
      - rule_uid: mon-notification-failed
        eval_time: 30m
        exp_samples: []
  - name: Scrape warning uses each target timeout
    interval: 1m
    input_series:
      - series: scrape_duration_seconds{job="fast"}
        values: 1.8+0x40
      - series: scrape_timeout_seconds{job="fast"}
        values: 2+0x40
      - series: up{job="fast"}
        values: 1+0x40
      - series: scrape_duration_seconds{job="slow"}
        values: 9+0x40
      - series: scrape_timeout_seconds{job="slow"}
        values: 20+0x40
      - series: up{job="slow"}
        values: 1+0x40
    promql_expr_test:
      - rule_uid: mon-scrape-near-timeout
        eval_time: 30m
        exp_samples:
          - labels: '{job="fast"}'
            value: 0.9
  - name: Failed scrape is handled by availability rule
    interval: 1m
    input_series:
      - series: scrape_duration_seconds{job="fast"}
        values: 2+0x40
      - series: scrape_timeout_seconds{job="fast"}
        values: 2+0x40
      - series: up{job="fast"}
        values: 0+0x40
    promql_expr_test:
      - rule_uid: mon-scrape-near-timeout
        eval_time: 30m
        exp_samples: []

  - name: Coverage respects 30s and 60s scrapes and detects missing samples
    interval: 30s
    input_series:
    - series: up{job="node",instance="normal"}
      values: 1+0x60
    - series: up{job="node-containers",instance="slow"}
      values: 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1
        _ 1 _ 1 _ 1
    - series: up{job="cs2-clickhouse",instance="slow"}
      values: 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1 _ 1
        _ 1 _ 1 _ 1
    - series: up{job="node",instance="gap"}
      values: 1+0x30 _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _
    promql_expr_test:
    - dashboard_panel: reliability:12:A
      eval_time: 30m
      exp_samples:
      - labels: '{job="node",instance="normal"}'
        value: 1
      - labels: '{job="node-containers",instance="slow"}'
        value: 1
      - labels: '{job="cs2-clickhouse",instance="slow"}'
        value: 1
      - labels: '{job="node",instance="gap"}'
        value: 0.5

  - name: Deployment mutes only its site and expires after ten minutes
    interval: 1m
    input_series:
    - series: probe_success{instance="https://cs.samoy.love/"}
      values: 0+0x20
    - series: probe_success{instance="https://snakes.samoy.love/"}
      values: 0+0x20
    - series: deploy_maintenance_until_seconds{app="cs2-api",site="https://cs.samoy.love/"}
      values: 600+0x20
    promql_expr_test:
    - rule_uid: infra-site-down
      eval_time: 2m
      exp_samples:
      - labels: probe_success{instance="https://snakes.samoy.love/"}
        value: 0
    - rule_uid: infra-site-down
      eval_time: 11m
      exp_samples:
      - labels: probe_success{instance="https://cs.samoy.love/"}
        value: 0
      - labels: probe_success{instance="https://snakes.samoy.love/"}
        value: 0
    alert_rule_test:
    - alertname: infra-site-down
      eval_time: 15m
      exp_alerts:
      - exp_labels:
          instance: https://cs.samoy.love/
          area: sites
          severity: critical
      - exp_labels:
          instance: https://snakes.samoy.love/
          area: sites
          severity: critical
  - name: Absent deployment marker never hides API downtime
    interval: 1m
    input_series:
    - series: up{job="cs2-api",instance="cs2-api"}
      values: 0+0x20
    promql_expr_test:
    - rule_uid: cs2-api-down
      eval_time: 6m
      exp_samples:
      - labels: up{job="cs2-api",instance="cs2-api"}
        value: 0
  - name: Updater transient is separate from runtime failure
    interval: 1m
    input_series:
    - series: incus_container_unit_failed{unit="cs2-render-update.service",container="cs2-render"}
      values: 1+0x20 0+0x120
    - series: incus_container_unit_failed{unit="cs2-render.service",container="cs2-render"}
      values: 1+0x140
    promql_expr_test:
    - rule_uid: cs2-container-unit-failed
      eval_time: 10m
      exp_samples:
      - labels: incus_container_unit_failed{unit="cs2-render.service",container="cs2-render"}
        value: 1
    - rule_uid: cs2-render-updater-failed
      eval_time: 10m
      exp_samples:
      - labels: incus_container_unit_failed{unit="cs2-render-update.service",container="cs2-render"}
        value: 1
    alert_rule_test:
    - alertname: cs2-render-updater-failed
      eval_time: 130m
      exp_alerts: []
  - name: Persistent updater failure is still actionable
    interval: 1m
    input_series:
    - series: incus_container_unit_failed{unit="cs2-render-update.service",container="cs2-render"}
      values: 1+0x130
    alert_rule_test:
    - alertname: cs2-render-updater-failed
      eval_time: 120m
      exp_alerts:
      - exp_labels:
          unit: cs2-render-update.service
          container: cs2-render
          area: cs2
          severity: warning
  - name: Invalid maintenance window is reported
    interval: 1m
    input_series:
    - series: deploy_maintenance_collect_ok
      values: 0+0x10
    promql_expr_test:
    - rule_uid: mon-deploy-window-invalid
      eval_time: 6m
      exp_samples:
      - labels: deploy_maintenance_collect_ok
        value: 0
  - name: Isolated limiter burst expires before alert hold
    interval: 1m
    input_series:
    - series: chillhub_http_requests_total{route="/metrics/report",code="429"}
      values: 0 100+0x30
    - series: chillhub_http_requests_total{route="/metrics/report",code="200"}
      values: 0+1x31
    promql_expr_test:
    - rule_uid: product-chillhub-telemetry-rate-limited
      eval_time: 10m
      exp_samples: []
    alert_rule_test:
    - alertname: product-chillhub-telemetry-rate-limited
      eval_time: 20m
      exp_alerts: []
  - name: Sustained limiter rejection still alerts
    interval: 1m
    input_series:
    - series: chillhub_http_requests_total{route="/metrics/report",code="429"}
      values: 0+10x30
    - series: chillhub_http_requests_total{route="/metrics/report",code="200"}
      values: 0+10x30
    alert_rule_test:
    - alertname: product-chillhub-telemetry-rate-limited
      eval_time: 20m
      exp_alerts:
      - exp_labels:
          area: sites
          severity: warning
  - name: Old or small render cohorts remain graphs not pages
    interval: 1m
    input_series:
