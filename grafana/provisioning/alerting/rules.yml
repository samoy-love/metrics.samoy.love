              expr: "histogram_quantile(0.95, sum by (le) (rate(cs2_http_request_duration_seconds_bucket{route!~\"статика|служебные|медиа\"}[15m]))) > 2 and on() sum(rate(cs2_http_requests_total{route!~\"статика|служебные|медиа\"}[15m])) > 0.05"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
