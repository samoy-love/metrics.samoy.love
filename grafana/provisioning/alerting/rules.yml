      - uid: cs2-render-failed
        title: "Пристрелка: клипы проваливаются"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Окно завершений из render_history переживает удаление и повтор
              # заданий; промо и диагностика не входят в пользовательскую тревогу.
              expr: "(sum by (engine) (cs2_render_failed_window{requester=~\"user|system\",window=\"1h\"}) >= 3) and on() (cs2_chain_scrape_up == 1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "За час провалилось три и больше заданий рендера", description: "Завершённые отказы пользовательских и автоматических заказов за час из render_history, отдельно по машине. Удаление или повтор render_jobs не вычитает уже случившиеся ошибки. Диагностические прогоны видны отдельно на дашборде и не входят в эту тревогу. Проверить классы ошибок и очередь машины; историю не удалять.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 3, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-failed", __dashboardUid__: "samoylove-cs2", __panelId__: "1702" }
      - uid: cs2-render-stalled
        title: "Пристрелка: заказ клипа ждёт больше получаса"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Возраст самого старого заказа: ноль при пустой очереди, так что
              # тишина работника без заказов тревогой не считается. Полчаса —
              # это холодный старт игры (полторы минуты) и десяток заданий
              # впереди с запасом; дольше ждёт только стоящая очередь.
              expr: "max by (engine) (cs2_render_waiting_seconds{class=~\"order|paid\"}) > 1800"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Заказ клипа человека ждёт машину {{ $labels.engine }} дольше получаса", description: "Человек заказал клип и ждёт. Считаются только заказы, которые можно взять прямо сейчас: без ждущих повтора и заданий сломанного движка, без промо. Смотреть «Машины рендера: отметка» — жива ли машина, и «Рендер: очередь по машинам».", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 30 мин, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-stalled", __dashboardUid__: "samoylove-cs2", __panelId__: "1603" }
      - uid: cs2-render-promo-late
        title: "Пристрелка: промо не успевает к сводке неделю подряд"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Не авария, а порог мощности: доля промо, снятых до сводки сессии, ниже
              # 95% ВСЮ неделю (максимум за семь суток ниже порога) — пора третья машина
              # (КОНСТРУКТОР-РОЛИКОВ, «Мощность рендера»). Метрика — скользящие сутки,
              # так что неделя берётся подзапросом по часу, а не for: 7d, который
              # обнуляется перезапуском Grafana. Условие на число часов с промо —
              # чтобы новая метрика или неделя почти без промо не решали по двум
              # заданиям. Ожидание по классам (cs2_render_waiting_seconds) отдельной
