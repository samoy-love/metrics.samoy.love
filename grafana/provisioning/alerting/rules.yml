              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Telegram отказал в отправке разбора три и больше раз за час", description: "Разборы после матча не доходят до людей. «токен_отвергнут» — ключ бота отозван, не дойдёт ничего: поставить новый CS2_TELEGRAM_BOT_TOKEN. «отказ» — ответ Telegram, причина в журнале cs2-chain. Люди, закрывшие бота, сюда не входят.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 3, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-telegram-rejected", __dashboardUid__: "samoylove-cs2", __panelId__: "1801" }

      - uid: cs2-music-provider-down
        title: "Пристрелка: провайдер музыки не отвечает"
        condition: C
