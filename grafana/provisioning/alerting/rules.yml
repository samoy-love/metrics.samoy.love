              expr: 'max_over_time((max(cs2_render_promo_day{state="in_time"}) / (sum(max by (state) (cs2_render_promo_day)) > 0))[7d:1h]) < 0.95 and count_over_time((sum(max by (state) (cs2_render_promo_day)) > 0)[7d:1h]) >= 120'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
