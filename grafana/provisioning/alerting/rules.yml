      # Свежесть снимков sanoid (30.09.2026, осмотр сервера). Список датасетов
      # сборщик node-textfile-collect (репозиторий home-server) берёт из самого
      # sanoid.conf: всё, что там снимается по autosnap. Снимки суточные, в
      # полночь UTC; 28 ч — одна пропущенная полночь с запасом на долгий
      # прогон. Датасет без единого снимка сборщик пишет нулём — возраст
      # огромный, тревога горит и на него.
