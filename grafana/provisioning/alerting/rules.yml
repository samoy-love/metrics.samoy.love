            model:
              # Ночная сверка сравнивает убийства, смерти, помощь и счёт матчей,
              # разобранных за трое суток, со сводкой Game Coordinator. У исправного
              # разбора расхождений нет, так что порог — ноль: любое число после выкатки
              # или обновления CS2 значит, что разбор считает не то. Значение держится
