          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Под клипы осталось меньше 4 ГБ: работник рендера встанет на двух", description: "Клипы стираются сами через месяц без обращений, так что это либо всплеск заказов, либо сироты — каталоги без записи в реестре (панель «Клипы: занято» покажет расхождение). Ниже двух гигабайт заказы перестают браться, и у людей клип «готовится» бесконечно. Решать владельцу: расширить квоту ZFS датасета tank/cs2-clips или укоротить срок жизни CS2_RENDER_CLIP_TTL.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-clip-storage-low", __dashboardUid__: "samoylove-cs2", __panelId__: "908" }
      # --- Здоровье машин рендера (ревью мощности 23.09.2026). Метрики по
      # машинам несут метку engine (linux, hlae), и выражения её не сводят:
      # тревога приходит отдельно по каждой машине, потому что чинятся они
      # порознь — контейнер cs2-render и Windows-машина cs2-win.
      - uid: cs2-render-first-try-low
        title: "Пристрелка: рендер часто не получается с первого раза"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Доля считается сервисом по неделе завершённых заданий, так что
              # сама по себе уже сглажена; сутки ниже порога — не случайность
              # одного вечера, а причина, которая держится.
              expr: "(cs2_render_first_try_by_requester_ratio{engine=~\"linux|hlae\",requester=~\"user|system\"} < 0.9) and on(engine,requester) (sum by(engine,requester) (cs2_render_finished_window{product=\"clip\",result=~\"done|failed\",window=\"24h\"}) >= 10) and on() (cs2_chain_scrape_up == 1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 24h
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Меньше 90% заданий рендера за неделю прошли с первой попытки (машина — метка engine)", description: "Доля за неделю остаётся на графике при любом объёме. Тревога требует не менее 10 завершённых клипов того же класса заказов и движка за последние сутки: маленькая или уже неактивная выборка не будит. Три окончательных отказа за час по-прежнему проверяются отдельным правилом независимо от объёма. Причины повторов — на панели 910.", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "Меньше 90% за неделю при 10 завершениях за последние сутки, держится 1 сут", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-first-try-low", __dashboardUid__: "samoylove-cs2", __panelId__: "910" }
      - uid: cs2-render-machine-space-low
        title: "Пристрелка: на машине рендера кончается место"
