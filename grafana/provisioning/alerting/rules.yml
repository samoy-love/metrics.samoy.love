        for: 30m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Внешняя проба падает, а агент статуса видит сайт живым", description: "Сломан маршрут самой пробы, а не сайт: так 12–19.09.2026 «Сайты: сайт не открывается» неделю горел critical при живых сайтах (DNS пробы). Смотреть blackbox-exporter и резолв внутри стека мониторинга.", threshold: "держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-probe-disagrees-with-agent", __dashboardUid__: "samoylove-overview", __panelId__: "28" }

  - orgId: 1
    name: product-chillhub
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-install-failure-rate-high
        title: "Лаунчер: больше 40% установок не завершились"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(increase(chillhub_game_installs_total{result!="ok"}[1h]))
                  /
                clamp_min(sum(increase(chillhub_game_installs_total[1h])), 1) > 0.4
                and
                sum(increase(chillhub_game_installs_total[1h])) >= 5
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: critical, area: sites }
        annotations: { summary: "Больше 40% установок за час не завершились", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 500%, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-install-failure-rate-high", __dashboardUid__: "samoylove-chillhub", __panelId__: "39" }

      - uid: product-diff-updates-not-working
        title: "Лаунчер: обновления качаются целиком"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(increase(chillhub_game_updates_total{result="ok",mode="full"}[6h]))
                  /
                clamp_min(sum(increase(chillhub_game_updates_total{result="ok"}[6h])), 1) > 0.8
                and
                sum(increase(chillhub_game_updates_total{result="ok"}[6h])) >= 5
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше 80% обновлений скачали сборку целиком — дифф не работает", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 500%, держится 1 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-diff-updates-not-working", __dashboardUid__: "samoylove-chillhub", __panelId__: "40" }

      - uid: product-hash-mismatches-high
        title: "Лаунчер: файлы не сходятся с манифестом"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_hash_mismatches_total[1h])) > 10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше десяти файлов за час не совпали с манифестом", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 10, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-hash-mismatches-high", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

      - uid: product-launcher-error-rate-high
        title: "Лаунчер: больше 5% ответов — пятисотки"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(rate(chillhub_http_requests_total{code=~"5.."}[15m]))
                  /
                clamp_min(sum(rate(chillhub_http_requests_total[15m])), 0.001) > 0.05
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical, area: sites }
        annotations: { summary: "Больше 5% ответов лаунчера с кодом 5xx", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 5%, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-launcher-error-rate-high", __dashboardUid__: "samoylove-chillhub", __panelId__: "41" }

      - uid: product-telemetry-rejected
        title: "Лаунчер: телеметрия отвергается"
        condition: C
        data:
          - refId: A
            # unknown_game исключён намеренно. Этот алерт задуман про НАШУ
            # поломку — разъехавшийся контракт после выкатки клиента или
            # переполненный диск. Отказ unknown_game означает обратное:
            # защита из gameid.go сработала и выкинула чужой мусор.
            #
            # На /metrics/report постоянно приходит поток чужих POST с
            # выдуманными gameId (случайный hex, UA лаунчера, пачки по пять с
            # ротацией адресов — ровно под лимитом 30/мин на адрес). За месяц
            # это ЕДИНСТВЕННАЯ причина отказов, то есть алерт ни разу не
            # сказал ничего про лаунчер и будил на штатной работе защиты.
            # Поток чужого мусора ловит отдельный TelemetryJunkFlood ниже.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_telemetry_rejected_total{reason!="unknown_game"}[1h])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше 20 отвергнутых отчётов телеметрии за час", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 20, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-telemetry-rejected", __dashboardUid__: "samoylove-chillhub", __panelId__: "999" }

      - uid: product-telemetry-junk-flood
        title: "Лаунчер: поток мусорной телеметрии"
        condition: C
        data:
          - refId: A
            # Чужие отчёты с выдуманным gameId — фон, а не событие: сотня в
            # сутки прилетает постоянно и не значит ничего, отказ стоит
            # разбора JSON и строчки в логе. Порог поэтому на порядок выше
            # фона: интересен не сам мусор, а его всплеск — попытка засыпать
            # ручку или продавить кардинальность меток.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_telemetry_rejected_total{reason="unknown_game"}[1h])) > 500
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше 500 отчётов с неизвестной игрой за час", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 500, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-telemetry-junk-flood", __dashboardUid__: "samoylove-chillhub", __panelId__: "999" }

      - uid: product-maintenance-mode-stuck
        title: "Лаунчер: режим обслуживания включён дольше получаса"
        condition: C
        data:
          - refId: A
            # 30 минут, а не мгновенно: включение на время реальной публикации
            # законно и не должно будить никого. Забытым включённым он
            # становится позже — и выглядит для пользователей как поломка
            # сайта, хотя сервис жив.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(chillhub_maintenance_enabled) == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Публичный API полчаса отдаёт заглушку техработ", threshold: "держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-maintenance-mode-stuck", __dashboardUid__: "samoylove-chillhub", __panelId__: "6" }

      - uid: product-chillhub-admin-error-rate-high
        title: "Лаунчер: админка отвечает ошибками"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Порог выше, чем у LauncherErrorRateHigh: трафик админки низкий
              # и однопользовательский, доля скачет сильнее на тех же
              # абсолютных числах — 5% здесь ловило бы шум, не аварию.
              expr: |
                100 * sum(rate(chillhub_http_requests_total{service="admin",code=~"5.."}[15m]))
                  /
                clamp_min(sum(rate(chillhub_http_requests_total{service="admin"}[15m])), 0.001) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше 20% ответов админки с кодом 5xx", value: '{{ if $values.A }}{{ printf "%.0f" $values.A.Value }}%{{ else }}нет данных{{ end }}', threshold: "больше 20%, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-chillhub-admin-error-rate-high", __dashboardUid__: "samoylove-chillhub", __panelId__: "42" }

      - uid: product-chillhub-client-errors-high
        title: "Лаунчер: у клиентов много ошибок"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_client_errors_total[1h])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше 20 ошибок у клиентов лаунчера за час", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 20, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-chillhub-client-errors-high", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

      - uid: product-chillhub-telemetry-rate-limited
        title: "Лаунчер: телеметрию режет ограничитель"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: "(sum(increase(chillhub_http_requests_total{route=\"/metrics/report\",code=\"429\"}[5m])) > 5) and on() (sum(rate(chillhub_http_requests_total{route=\"/metrics/report\",code=\"429\"}[5m])) / clamp_min(sum(rate(chillhub_http_requests_total{route=\"/metrics/report\"}[5m])), 0.001) > 0.1)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: "15m"
        labels: { severity: warning, area: sites }
        annotations: { summary: "Приём телеметрии отвечает 429", description: "Ограничитель устойчиво отбрасывает телеметрию лаунчеров. Проверить частоту отправки и долю 429. Одиночный всплеск уходит из пятиминутного окна до срабатывания; ограничитель не отключать.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "Больше 5 отказов за 5 мин и 10% запросов, непрерывно 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-chillhub-telemetry-rate-limited", __dashboardUid__: "samoylove-chillhub", __panelId__: "56" }

      - uid: product-chillhub-admin-login-failures
        title: "Лаунчер: подбирают пароль админки"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: 'sum(increase(chillhub_admin_logins_total{result="fail"}[1h])) > 10'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning, area: sites }
        annotations: { summary: "Больше 10 неудачных входов в админку за час", description: "Похоже на подбор пароля к админке лаунчера.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 10", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-chillhub-admin-login-failures", __dashboardUid__: "samoylove-chillhub", __panelId__: "22" }

      - uid: product-chillhub-integrity-check-failed
        title: "Лаунчер: проверка целостности не прошла"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: 'sum(increase(chillhub_integrity_checks_total{result!="ok"}[1h])) > 0'
              instant: true
