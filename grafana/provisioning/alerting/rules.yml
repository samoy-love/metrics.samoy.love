                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Провайдер музыки {{ $labels.provider }} отказывает больше чем в половине обращений", description: "Вкладка этого провайдера в конструкторе роликов пуста, ролики с его треками не соберутся. У Яндекса обычно истёк вход или сменился API; у Jamendo — client_id. Причина словами провайдера — в журнале cs2-api.", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 500%, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-music-provider-down", __dashboardUid__: "samoylove-cs2", __panelId__: "1902" }

      - uid: cs2-pages-slow
        title: "Пристрелка: страницы сайта отвечают медленно"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
