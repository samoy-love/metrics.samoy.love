  # ═══════════════════════════════════════════════════════════════════════════
  # ПРИСТРЕЛКА (cs.samoy.love) — РАЗБОР МАТЧЕЙ CS2. По-русски с 10.09.2026
  # (решение владельца), с 29.09.2026 так же и все остальные группы.
  #
  # Имя правила и текст — это то, что человек читает в чате ночью, и читать
  # он должен не «Cs2ChainStalled», а что именно сломалось и что от этого не
  # работает у игрока.
  #
  # У КАЖДОГО ПРАВИЛА ДВА ТЕКСТА, И ОНИ РАЗНЫЕ ПО НАЗНАЧЕНИЮ:
  #   summary     — что произошло, одной строкой;
  #   description — ЧТО ЭТО ЗНАЧИТ ДЛЯ ИГРОКА и что делать.
  # Второе важнее первого. Тревога, из которой не видно последствия, требует
  # похода в код, чтобы понять, надо ли вставать; а тревога, по которой не
  # встают, через месяц выключается вместе со всеми остальными.
  #
  # ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ:
  #   • тревоги на cs2_chain_demos_expired — истёкшие демки лечению не
  #     подлежат, это учёт потерянного, а не повод будить. Смотреть вперёд
  #     обязана «Демки вот-вот исчезнут у Valve», у которой ещё есть время;
  #   • тревоги на лабораторный режим — он включён владельцем осознанно, и
  #     напоминать о нём каждые сутки значит приучить не читать;
  #   • тревоги на «профиль закрыт» в ответах Steam — это нормальный ответ
  #     про обычного человека с обычными настройками приватности.
  #
  # Демки хранятся ЦЕЛИКОМ, ретеншна нет: это осознанное решение, а не
  # недоделка. Значит место кончится, и единственная защита от того, чтобы это
  # случилось внезапно, — предупредить заранее. Датасет ограничен квотой ZFS,
  # поэтому переполнение остановит приём демок, а не заполнит общий пул, на
  # котором живут прод и сборочные машины.
  - orgId: 1
    name: product-cs2
    folder: Alerts
    interval: 1m
    rules:
      - uid: cs2-api-down
        title: "Пристрелка: сайт не отвечает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(up{job=\"cs2-api\"} == 0) unless on() (deploy_maintenance_until_seconds{app=\"cs2-api\"} > time())"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: cs2 }
        annotations: { summary: "Служба cs2-api не отвечает на сбор метрик", description: "Для игрока это полностью недоступный сайт: ни разбора, ни истории, ни входа. Смотреть journalctl -u cs2-api в контейнере cs2; выкатка откатывается сама, если не поднялся healthz.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-api-down", __dashboardUid__: "samoylove-cs2", __panelId__: "100" }
      - uid: cs2-not-ready
