                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Режим машины рендера {{ $labels.engine }} не совпадает с режимом сервиса", description: "Сервис лабораторный, а машина — нет: ролики с неё выходят без лабораторных ассетов. Вреда людям нет, но решено было иначе. Поправить CS2_MODE в настройках машины и перезапустить работника.", threshold: "держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-mode-mismatch", __dashboardUid__: "samoylove-cs2", __panelId__: "1602" }

      - uid: cs2-render-lab-at-public
        title: "Пристрелка: лабораторная машина рендера при публичном сервисе"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Машина в лабораторном режиме (CS2_MODE) при публичном сервисе берёт в
              # ролики ассеты без лицензии — ровно то, что рубильник режимов должен был
              # выключить. cs2_render_mode_mismatch различает только «совпадает или нет»;
              # сервис публичный, значит, машина — не публичная. Пять минут — отметка
