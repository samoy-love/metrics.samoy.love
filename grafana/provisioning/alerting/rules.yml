            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Обратное расхождение: публичная машина при лабораторном сервисе. Оно
              # только теряет лабораторные ассеты, поэтому warning; опасный случай —
              # правило ниже.
              expr: 'cs2_render_mode_mismatch == 1 unless on() cs2_service_mode{mode="public"} == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
