        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Больше пятой части аватаров не отдаётся", description: "Вместо лиц на страницах серые кружки; сама страница при этом целая, и без этой тревоги мы бы не узнали вовсе. «нет_аватара» сюда не входит: это не отказ, а человек без картинки в Steam.", __dashboardUid__: "samoylove-cs2", __panelId__: "507" }
      - uid: cs2-page-slow
        title: "CS2: страница матча стала медленной"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'histogram_quantile(0.95, sum by (le) (rate(cs2_http_request_duration_seconds_bucket{route="страница_матча"}[15m]))) > 3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "p95 страницы матча перевалил за три секунды", description: "Разбор считается по ClickHouse на лету, поэтому медленно здесь — это медленно у человека, открывшего свой матч. Смотреть запросы отчёта и объём архива, а не «сайт тормозит»: остальные разделы могут быть быстрыми.", __dashboardUid__: "samoylove-cs2", __panelId__: "102" }
      - uid: cs2-storage-warn
        title: "CS2: хранилище демок заполняется"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_demo_storage_used_bytes / cs2_demo_storage_total_bytes > 0.70'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Занято больше 70% квоты хранилища демок", description: "Ретеншна нет намеренно: демки хранятся целиком, и место когда-нибудь кончится. Знать об этом надо заранее — расширить квоту или заняться оптимизацией хранения, — а не в тот день, когда приём встанет.", __dashboardUid__: "samoylove-cs2", __panelId__: "701" }
      - uid: cs2-storage-crit
        title: "CS2: хранилище демок почти полное"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_demo_storage_used_bytes / cs2_demo_storage_total_bytes > 0.85'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Занято больше 85% квоты хранилища демок", description: "Скачиватель уже останавливает круги, когда остаётся меньше десяти гигабайт: новые матчи перестают забираться, а окно у Valve — тридцать дней. Загрузка руками тоже начнёт отказывать. Место кончается тихо и сразу у всех, включая временные файлы разбора.", __dashboardUid__: "samoylove-cs2", __panelId__: "701" }
      # --- Рендер клипов (план cs2 29Д). Очередь лежит в той же базе, что и
      # всё остальное, и метрики по ней считает cs2-api, а не сам работник в
      # контейнере cs2-render: у того своей мишени сборщика нет. Третья
      # тревога из плана — «датасет клипов у квоты» — ждёт самого датасета
      # (29Г) и его метрики; заводить правило по метрике, которой нет, значит
      # получить вечное NoData вместо тревоги.
      - uid: cs2-render-failed
        title: "CS2: клип не отрендерился"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Провалы копятся в базе навсегда, поэтому по приросту за час,
              # а не по абсолютному числу: старый провал не должен гореть месяц.
              expr: 'delta(cs2_render_jobs{state="failed"}[1h]) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "За последний час заказ клипа провалился окончательно", description: "Человек клипа не получит: попытки исчерпаны (три) или отказ окончательный сразу — битая демка, неизвестный вид, игрока нет в матче. Причина словами лежит в render_jobs.error и в journalctl -u cs2-render контейнера cs2-render. Серия провалов подряд — не демки, а сама игра: обновление CS2, отвалившийся Steam, кончившееся место под кадры.", __dashboardUid__: "samoylove-cs2", __panelId__: "902" }
      - uid: cs2-render-stalled
        title: "CS2: очередь клипов стоит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Возраст самого старого заказа: ноль при пустой очереди, так что
              # тишина работника без заказов тревогой не считается. Полчаса —
              # это холодный старт игры (полторы минуты) и десяток заданий
              # впереди с запасом; дольше ждёт только стоящая очередь.
              expr: 'cs2_render_oldest_queued_seconds > 1800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Самый старый заказ клипа ждёт дольше получаса", description: "Заказы есть, а работник рендера их не берёт: контейнер cs2-render выключен, служба упала, Steam не вошёл или игра не поднялась после обновления. Для человека это клип, который «готовится» бесконечно. Смотреть systemctl status cs2-render и экран игры по VNC в /admin; задание с истёкшей арендой работник переберёт сам после перезапуска.", __dashboardUid__: "samoylove-cs2", __panelId__: "903" }
      - uid: cs2-clip-storage-low
        title: "CS2: место под клипы кончается"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Датасет tank/cs2-clips с квотой 40 ГиБ; ниже двух гигабайт остатка
              # работник заказов не берёт. Порог — четыре: за день до остановки
              # при темпе «десяток клипов Full HD в час».
              expr: '(cs2_clip_storage_total_bytes - cs2_clip_storage_used_bytes) / 1024^3 < 4 and cs2_clip_storage_total_bytes > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Под клипы осталось меньше 4 ГБ: работник рендера встанет на двух", description: "Клипы стираются сами через месяц без обращений, так что это либо всплеск заказов, либо сироты — каталоги без записи в реестре (панель «Клипы: занято» покажет расхождение). Ниже двух гигабайт заказы перестают браться, и у людей клип «готовится» бесконечно. Решать владельцу: расширить квоту ZFS датасета tank/cs2-clips или укоротить срок жизни CS2_RENDER_CLIP_TTL.", __dashboardUid__: "samoylove-cs2", __panelId__: "908" }

  # --- CI: очередь на своих раннерах -----------------------------------------
  # Данные — сборщик ci-queue-collect на хосте (репозиторий home-server,
  # scripts/ci-queue-collect.py), textfile node-host, опрос GitHub раз в 30 с.
  # Сигнал — возраст САМОГО СТАРОГО ждущего задания, а не число ждущих: пачка
  # из трёх PR ставит в очередь полтора десятка заданий на минуту, и это
  # норма, а одно задание, ждущее десять минут, — нет.
  #
  # noDataState OK у правил очереди безопасен только вместе с последним
  # правилом группы: если сборщик встал, ряды замирают, и об этом говорит
  # CIQueueCollectorStale, а не молчание.
  - orgId: 1
    name: infra-ci
    folder: Alerts
    interval: 1m
    rules:
      - uid: ci-queue-stuck-linux
        title: CIQueueStuckLinux
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(ci_job_queue_oldest_seconds{pool="home-linux"}) > 600
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A job has been waiting for a home Linux runner for over 10 minutes", description: "Очередь на домашние Linux-раннеры копится: самое старое задание ждёт больше 10 минут. Если на панели «Идут и ждут» идущих четыре — раннеров не хватает (много параллельных PR и выкаток). Если идущих меньше — раннеры не берут работу: на хосте systemctl status ci-runner-cycle@ci-runner* и журнал раннера.", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-queue-stuck-windows
        title: CIQueueStuckWindows
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(ci_job_queue_oldest_seconds{pool="home-windows"}) > 900
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A job has been waiting for win-builder for over 15 minutes", description: "Задание на Windows-раннер ждёт больше 15 минут, а машине на загрузку хватает минуты. Значит, win-builder не поднялась или раннер на ней офлайн: journalctl -u win-builder-ondemand на хосте, состояние службы раннера в VM (Home Server CLAUDE.md, раздел про win-builder).", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-linux-runners-missing
        title: CILinuxRunnersMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: (sum(ci_runners{os="linux",status="online"}) or vector(0)) < 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Fewer than 3 of 4 home Linux runners are online for 15 minutes", description: "Одноразовый раннер между заданиями пропадает на секунды, но не на 15 минут: он не вернулся после отката снапшота. Очередь пока может быть пуста, но следующая пачка PR пойдёт медленнее. На хосте: systemctl status 'ci-runner-cycle@*'.", __dashboardUid__: "samoylove-ci", __panelId__: "7" }

      - uid: ci-queue-collector-stale
        title: CIQueueCollectorStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: (time() - max(ci_queue_collect_timestamp_seconds)) > 600 or max(ci_queue_collect_ok) == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "CI queue collector has not reported for 10 minutes", description: "Сборщик очереди раннеров (ci-queue-collect на хосте) не пишет данные или не может опросить GitHub. Пока это так, тревоги об очереди молчат. На хосте: systemctl status ci-queue-collect.timer, journalctl -u ci-queue-collect.", __dashboardUid__: "samoylove-ci", __panelId__: "13" }

  # --- Мониторинг сам о себе -------------------------------------------------
  # Ревью панелей 19.09.2026 нашло, что у части целей сбора нет ни одного
  # правила на up: prometheus, grafana, node, snakes и оба процесса chillhub
  # могли выпасть из сбора молча, и панели просто замирали. У остальных целей
  # (node-host, incus, blackbox, nginxlog, cs2-api) правила уже есть в своих
  # группах — здесь они исключены, чтобы не слать двух сообщений об одном.
  - orgId: 1
    name: infra-monitoring
    folder: Alerts
    interval: 1m
    rules:
      - uid: mon-scrape-target-down
        title: ScrapeTargetDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'up{job!~"node-host|incus|blackbox-http|nginxlog|cs2-api"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A scrape target has been down for 5 minutes", description: "Prometheus не может снять метрики с цели (метка job). Панели этой цели замерли на последних значениях, а тревоги по её метрикам молчат. Для snakes и chillhub частая причина — ограничение сети в юните сервиса (README, «Как добавить цель сбора»)." }

      - uid: mon-prometheus-reload-failed
        title: PrometheusConfigReloadFailed
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'prometheus_config_last_reload_successful == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Prometheus failed to reload its configuration", description: "Prometheus работает на старом конфиге: изменения целей из последней выкатки не применились. Смотреть журнал контейнера samoylove-prometheus." }

      - uid: mon-grafana-rule-eval-failing
        title: GrafanaRuleEvaluationFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum by (rule_group) (increase(grafana_alerting_rule_evaluation_failures_total[30m])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Grafana fails to evaluate alert rules", description: "Правило, которое не вычисляется, не видит того, что должно сторожить. Какое именно — страница /alerting/list, состояние Error." }

      - uid: mon-host-textfile-stale
        title: HostTextfileStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'time() - node_textfile_mtime_seconds{job="node-host"} > 1800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A textfile metrics file on the host has not been updated for 30 minutes", description: "Сборщик на хосте завис или его таймер встал (файл — метка file: smart.prom и zfs.prom пишет node-textfile-collect раз в 5 минут, ci.prom — ci-queue-collect раз в 30 секунд). Старые значения при этом выглядят живыми, и SmartCollectFailing молчит." }
