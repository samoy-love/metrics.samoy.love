      - uid: product-snakes-ws-errors-high
        title: SnakesWsErrorsHigh
        condition: C
        data:
          - refId: A
            # Порог не откалиброван по реальным данным — начальная прикидка.
            # Если начнёт шуметь или, наоборот, молчать при заметных разрывах,
            # число 10 в минуту стоит пересмотреть по факту, а не вслепую.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                60 * (
                  sum(rate(snakes_ws_dropped_messages_total[10m]))
                    +
                  sum(rate(snakes_ws_write_errors_total[10m]))
                    +
                  sum(rate(snakes_ws_handshake_rejected_total[10m]))
                ) > 10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "More than 10 WebSocket failures per minute — players are getting dropped", __dashboardUid__: "samoylove-snakes", __panelId__: "23" }

      - uid: product-snakes-tick-slow
        title: SnakesTickSlow
        condition: C
        data:
          - refId: A
            # 100ms — прикидка бюджета тика, не измеренный факт. Как и порог
            # выше, стоит сверить с реальным p95 после недели наблюдений.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: histogram_quantile(0.95, sum(rate(snakes_tick_duration_seconds_bucket[10m])) by (le)) > 0.1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Game tick p95 is over budget — every player feels the lag", __dashboardUid__: "samoylove-snakes", __panelId__: "29" }
