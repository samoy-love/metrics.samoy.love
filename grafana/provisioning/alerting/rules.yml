      - uid: cs2-telegram-down
        title: "CS2: бот Telegram не отвечает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # `or vector(0)` — ЧТОБЫ ПРАВИЛО РАБОТАЛО И ДО ПЕРВОГО УСПЕХА.
              # Пока удачного опроса не случилось ни разу, ряда с result="ok"
              # не существует вовсе, increase отдаёт пустоту, и «бот молчит»
              # молчало само — ровно в том случае, ради которого написано.
              expr: '(sum(increase(cs2_telegram_polls_total{result="ok"}[15m])) or vector(0)) == 0 and on() cs2_worker_enabled{worker="бот"} == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Пятнадцать минут ни одного удачного опроса Telegram", description: "Третий шаг первого захода не проходится: код привязки из ссылки некому погасить, и человек застревает на странице «привяжи бота». Одиночные обрывы опроса (unexpected EOF, сброс соединения — обход блокировок на роутере, чаще в начале часа) бот переживает сам за секунды, поэтому тревога — на долгое молчание, а не на число обрывов: до 11.09.2026 она горела от пяти обрывов в час при живом боте.", __dashboardUid__: "samoylove-cs2", __panelId__: "507" }
