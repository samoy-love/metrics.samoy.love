        annotations: { summary: "В {{ $labels.name }} OOM-killer убил процесс", description: "Процесс убит за нехватку памяти в инстансе (метка name): он умер молча, и то, что он делал, не доехало. Разбор 19.09.2026: все 17 убийств в web — это Chromium рендерера скриншотов с лимитом 512 МБ, шесть в cs2-render — старый потолок игры, поднятый с тех пор. Считается increase, а не changes: у одноразовых раннеров счётчик обнуляется на каждом задании, поэтому они исключены по имени — и большие ci-runner, и лёгкие ci-light. Нарочные потолки внутри cs2 (работник, разбор демки под limitmem) метрика Incus отличить не умеет — для этого нужен сбор по cgroup. С 29.09.2026 cs2-render здесь не считается: 55 убийств за неделю давали сообщение на каждое, у рендера теперь своя тревога с порогом — «Пристрелка: рендер убивают по памяти».", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-instance-oom-kills", __dashboardUid__: "samoylove-hardware", __panelId__: "58" }

      - uid: hw-memory-pressure
