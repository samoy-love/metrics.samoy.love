        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: (time() - monitoring_containers_collect_timestamp_seconds > 180) or (monitoring_containers_collect_ok == 0) or (monitoring_container_collect_ok == 0) or (absent(monitoring_containers_collect_timestamp_seconds)
                and on() (max(up{job="node"}) == 1))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
