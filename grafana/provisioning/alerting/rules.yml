  # --- CI: очередь на своих раннерах -----------------------------------------
  # Данные — сборщик ci-queue-collect на хосте (репозиторий home-server,
  # scripts/ci-queue-collect.py), textfile node-host, опрос GitHub раз в 30 с.
  # Сигнал — возраст САМОГО СТАРОГО ждущего задания, а не число ждущих: пачка
  # из трёх PR ставит в очередь полтора десятка заданий на минуту, и это
  # норма, а одно задание, ждущее десять минут, — нет.
  #
  # noDataState OK у правил очереди безопасен только вместе с последним
  # правилом группы: если сборщик встал, ряды замирают, и об этом говорит
  # CIQueueCollectorStale, а не молчание.
  - orgId: 1
    name: infra-ci
    folder: Alerts
    interval: 1m
    rules:
      - uid: ci-queue-stuck-linux
        title: "CI: задание ждёт Linux-раннер дольше 10 минут"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'max(ci_job_queue_oldest_seconds{pool=~"home-linux|set-heavy"}) > 600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Задание в очереди на большие Linux-раннеры ждёт дольше 10 минут", description: "Очередь на собственные Linux-раннеры копится: самое старое задание ждёт больше 10 минут. Число раннеров меняет ci-autoscaler: если на панели «Почему не поднимает новых» упор в память — очередь стоит из-за бюджета или хоста (см. «CI: раннерам не хватает памяти хоста»). Если упора нет, а раннеры есть, — они не берут работу: на хосте ci-autoscaler status и journalctl -u 'ci-runner-cycle@*'.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 10 мин, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-queue-stuck-linux", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-queue-stuck-light
        title: "CI: задание ждёт лёгкий раннер дольше 5 минут"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'max(ci_job_queue_oldest_seconds{pool=~"home-light|set-light"}) > 300'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Задание в очереди на лёгкие раннеры ждёт дольше 5 минут", description: "Очередь на лёгкие раннеры (метка light; сколько их, решает ci-autoscaler): линтеры, тесты на Node, снимки страниц и покрытие. Работы в таком задании секунды, поэтому пять минут ожидания значат, что лёгких не хватает или они не берут работу. Порог ниже, чем у больших, по той же причине.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 5 мин, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-queue-stuck-light", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-queue-stuck-windows
        title: "CI: задание ждёт win-builder дольше 15 минут"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(ci_job_queue_oldest_seconds{pool="home-windows"}) > 900
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Задание в очереди на win-builder ждёт дольше 15 минут", description: "Задание на Windows-раннер ждёт больше 15 минут, а машине на загрузку хватает минуты. Значит, win-builder не поднялась или раннер на ней офлайн: journalctl -u win-builder-ondemand на хосте, состояние службы раннера в VM (Home Server CLAUDE.md, раздел про win-builder).", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 15 мин, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-queue-stuck-windows", __dashboardUid__: "samoylove-ci", __panelId__: "17" }

      - uid: ci-linux-runners-missing
        title: "CI: поднятые раннеры не видны в GitHub"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              # С 25.09.2026 раннеров столько, сколько поднял ci-autoscaler, и
              # постоянного порога нет: ночью законно два. Сравнивается то, что
              # контроллер считает поднятым и зарегистрированным (свободен или
              # занят), с тем, что видит GitHub. min за 5 минут: одноразовый
              # раннер на секунды уходит в offline при каждом откате.
              # НЕ WINDOWS, А НЕ os="linux" (27.09.2026). Раннеры из scale set GitHub
              # отдаёт с os="unknown", и с 25.09.2026 правило видело ноль Linux-раннеров
              # в онлайне при шести живых: тревога горела двое суток, пока задания шли.
              expr: 'min_over_time(((sum(ci_autoscaler_slots{state=~"idle|busy"}) or vector(0)) - (sum(ci_runners{os!="windows",status="online"}) or vector(0)))[5m:30s]) >= 2'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Контроллер поднял раннеры, а GitHub видит онлайн на два меньше", description: "Контроллер ci-autoscaler считает минимум двух раннеров поднятыми (процесс раннера жив), а GitHub не видит их в онлайне уже 15 минут. Значит, раннеры не могут до него достучаться или регистрация не проходит, и задания стоят. На хосте: ci-autoscaler status, journalctl -u 'ci-runner-cycle@*'.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 2, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-linux-runners-missing", __dashboardUid__: "samoylove-ci", __panelId__: "19" }

      - uid: ci-autoscaler-down
        title: "CI: контроллер раннеров молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Такт контроллера — 5 с. Две минуты тишины — служба стоит или
              # висит. absent — метрика пропала совсем (служба не запускалась
              # после перезагрузки или файл метрик удалён).
              expr: '((time() - max(ci_autoscaler_timestamp_seconds)) > 120) or (absent(ci_autoscaler_timestamp_seconds) * 1e6)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 3m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Контроллер раннеров не отмечался больше двух минут", description: "ci-autoscaler не закончил такт больше двух минут. Раннеры это переживут: цикл, не видящий свежего пульса контроллера, работает по-старому, класс по имени. Но под очередь новые не поднимутся, лишние не погаснут, а запаркованные слоты так и останутся стоять. На хосте: systemctl status ci-autoscaler, journalctl -u ci-autoscaler.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 3 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-autoscaler-down", __dashboardUid__: "samoylove-ci", __panelId__: "45" }

      - uid: ci-autoscaler-memory-bound
        title: "CI: раннерам не хватает памяти хоста"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              # Упор в память сам по себе норма пика: контроллер для того и
              # держит бюджет. Тревога — когда из-за него задание ждёт больше
              # 15 минут: тогда либо бюджет мал для нынешней нагрузки, либо
              # хост занят чем-то другим надолго.
              expr: '(max(ci_autoscaler_blocked{reason=~"budget|host"}) == 1) and on() (max(ci_job_queue_oldest_seconds{pool=~"home-linux|home-light|set-heavy|set-light"}) > 900)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Контроллер упёрся в память, а задания ждут дольше 15 минут", description: "Задание ждёт раннер больше 15 минут, и контроллер не поднимает новых из-за памяти. Причина budget — сумма потолков раннеров дошла до ci_mem_max в /etc/ci-autoscaler.toml на хосте: поднять бюджет, если хосту хватает. Причина host — память занята не CI (рендер, Windows-машины, прод): смотреть панель «Память инстансов» на панели железа.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-autoscaler-memory-bound", __dashboardUid__: "samoylove-ci", __panelId__: "54" }

      # Набор ядер раннеров (причина cpu_pool, с 30.09.2026): контроллер не
      # поднимает раннер, потому что общий набор ядер с учётом ожидаемого
      # расхода уже полон. Отдельно от тревоги о памяти: лечится другим
      # (cpu_pool_max или состав набора), а тексту о памяти эта причина чужая.
      - uid: ci-autoscaler-cpu-bound
        title: "CI: раннерам не хватает ядер"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: '(max(ci_autoscaler_blocked{reason="cpu_pool"}) == 1) and on() (max(ci_job_queue_oldest_seconds{pool=~"home-linux|home-light|set-heavy|set-light"}) > 900)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Контроллер упёрся в набор ядер, а задания ждут дольше 15 минут", description: "Задание ждёт раннер больше 15 минут, и контроллер не поднимает новый: общий набор ядер раннеров (cpu_pool) с учётом ожидаемого расхода уже занят. Если ядра набора на деле простаивают, ожидаемый расход завышен: смотреть ci_autoscaler_cpu_pool_cores (used, reserved, max) и cpu_pool_max в /etc/ci-autoscaler.toml на хосте. Если заняты, CI упирается в процессор, и новый раннер только растянул бы все задания.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-autoscaler-cpu-bound", __dashboardUid__: "samoylove-ci", __panelId__: "54" }

      - uid: ci-autoscaler-actions-failing
        title: "CI: контроллер не может поднять или погасить раннер"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum(increase(ci_autoscaler_actions_total{result="fail"}[15m])) >= 3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Три и больше неудачных действий контроллера за 15 минут", description: "За 15 минут три и больше действий ci-autoscaler не удались: не создаётся слот, не снимается регистрация через API GitHub, не стартует служба слота или адрес слота не входит в изоляцию (такой слот контроллер не запускает намеренно). Причина — в журнале: journalctl -u ci-autoscaler | grep '!'.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 3", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-autoscaler-actions-failing", __dashboardUid__: "samoylove-ci", __panelId__: "56" }

      - uid: ci-scaleset-listener-down
        title: "CI: слушатель Runner Scale Set отключён"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Сессия набора закрыта, слушатель давно не получал ответа
              # (долгий опрос отвечает не реже ~50 с) или метрик нет вовсе.
              expr: '(min(ci_scaleset_session_up) == 0) or ((time() - min(ci_scaleset_last_update_timestamp_seconds)) > 180) or (absent(ci_scaleset_session_up) * 1e6)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Слушатель наборов раннеров не на связи с GitHub", description: "Слушатель ci-scaleset не держит сессию набора Runner Scale Set или давно не получал ответа. Задания с runs-on home-heavy или home-light при этом назначаются набору только после переподключения, а контроллер берёт спрос у сборщика очереди (раз в 30 с). После падения сессия занята до минуты — это штатно; дольше — journalctl -u ci-scaleset на хосте.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-scaleset-listener-down", __dashboardUid__: "samoylove-ci", __panelId__: "58" }

      - uid: ci-queue-collector-stale
        title: "CI: сборщик очереди GitHub молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: (time() - max(ci_queue_collect_timestamp_seconds)) > 600 or max(ci_queue_collect_ok) == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Сборщик очереди заданий не обновлялся больше 10 минут", description: "Сборщик очереди раннеров (ci-queue-collect на хосте) не пишет данные или не может опросить GitHub. Пока это так, тревоги об очереди молчат. На хосте: systemctl status ci-queue-collect.timer, journalctl -u ci-queue-collect.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-queue-collector-stale", __dashboardUid__: "samoylove-ci", __panelId__: "13" }

      - uid: ci-orphan-docker
        title: "CI: сирота docker в раннере без задания"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: "(max by (name) (incus_memory_MemTotal_bytes{name=~\"ci-(runner|light).*\"} - incus_memory_MemAvailable_bytes{name=~\"ci-(runner|light).*\"})) * on(name) group_left() (max by (name) (label_replace(ci_autoscaler_slot{state=\"idle\"}, \"name\", \"$1\", \"slot\", \"(.*)\")) == 1) > 1.5 * 1024^3"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 20m
        labels: { severity: warning, area: ci }
        annotations: { summary: "Раннер {{ $labels.name }} без задания держит больше 1,5 ГиБ памяти", description: "Docker-сборка упавшего прогона осталась жить после того, как GitHub закрыл задание (26.09.2026 так восемь часов крутился devkita64). Раннер держит память хоста, контроллер не поднимает новых, хост уходит в давление памяти. Найти: ps внутри раннера; убить через cgroup.kill docker-*.scope, затем перезапустить раннер.", value: '{{ if $values.A }}{{ humanize1024 $values.A.Value }}Б{{ else }}нет данных{{ end }}', threshold: "больше 1,5 ГиБ, держится 20 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#ci-orphan-docker", __dashboardUid__: "samoylove-ci", __panelId__: "70" }

  # --- Мониторинг сам о себе -------------------------------------------------
  # Ревью панелей 19.09.2026 нашло, что у части целей сбора нет ни одного
  # правила на up: prometheus, grafana, node, snakes и оба процесса chillhub
  # могли выпасть из сбора молча, и панели просто замирали. У остальных целей
  # (node-host, incus, blackbox, nginxlog, cs2-api) правила уже есть в своих
  # группах — здесь они исключены, чтобы не слать двух сообщений об одном.
  - orgId: 1
    name: infra-monitoring
    folder: Alerts
    interval: 1m
    rules:
      - uid: mon-scrape-target-down
        title: "Мониторинг: цель сбора не отвечает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(up{job!~\"node-host|incus|blackbox-http|nginxlog|cs2-api|cs2-win\"} == 0) unless on(job) label_replace((deploy_maintenance_until_seconds{target!=\"\"} > time()), \"job\", \"$1\", \"target\", \"(.+)\")"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Prometheus не может собрать {{ $labels.job }}", description: "Prometheus не может снять метрики с цели (метка job). Панели этой цели замерли на последних значениях, а тревоги по её метрикам молчат. Для snakes и chillhub частая причина — ограничение сети в юните сервиса (README, «Как добавить цель сбора»).", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-scrape-target-down", __dashboardUid__: "samoylove-overview", __panelId__: "26" }

      - uid: mon-prometheus-reload-failed
        title: "Мониторинг: Prometheus не принял конфиг"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'prometheus_config_last_reload_successful == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Последняя перезагрузка конфига Prometheus не удалась", description: "Prometheus работает на старом конфиге: изменения целей из последней выкатки не применились. Смотреть журнал контейнера samoylove-prometheus.", threshold: "держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-prometheus-reload-failed", __dashboardUid__: "samoylove-overview", __panelId__: "49" }

      - uid: mon-grafana-rule-eval-failing
        title: "Мониторинг: правила тревог не вычисляются"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'sum(increase(grafana_alerting_rule_evaluation_failures_total[30m])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Grafana не может вычислить правила тревог", description: "Правило, которое не вычисляется, не видит того, что должно сторожить. Какое именно — страница /alerting/list, состояние Error.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-grafana-rule-eval-failing", __dashboardUid__: "samoylove-overview", __panelId__: "51" }

      - uid: mon-host-textfile-stale
        title: "Мониторинг: файл метрик на хосте устарел"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              # backup_laptop.prom пишет ночная копия на ноутбук раз в сутки
              # (с 30.09.2026) — её свежесть сторожит «копия на ноутбук
              # старше 36 часов», а здесь она горела бы каждые полчаса.
              expr: 'time() - node_textfile_mtime_seconds{job="node-host",file!~".*/backup_laptop.prom"} > 1800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Файл {{ $labels.file }} не обновлялся больше 30 минут", description: "Сборщик на хосте завис или его таймер встал (файл — метка file: smart.prom и zfs.prom пишет node-textfile-collect раз в 5 минут, ci.prom — ci-queue-collect раз в 30 секунд). Старые значения при этом выглядят живыми, и «Сервер: сбор SMART и ZFS сломан» молчит.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 30 мин, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-host-textfile-stale", __dashboardUid__: "samoylove-overview", __panelId__: "49" }

      - uid: mon-scrape-target-missing
        title: "Мониторинг: цель сбора пропала из конфига"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: 'absent(up{job="node-host"}) or absent(up{job="incus"}) or absent(up{job="cs2-api"}) or absent(up{job="cs2-win"}) or absent(up{job="cs2-postgres"}) or absent(up{job="cs2-clickhouse"}) or absent(up{job="node"}) or absent(up{job="node-containers"}) or absent(up{job="grafana"}) or absent(up{job="prometheus"}) or absent(up{job="nginxlog"}) or absent(up{job="blackbox-http"}) or absent(up{job="snakes"}) or absent(up{job="chillhub-api"}) or absent(up{job="chillhub-admin"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Цели сбора хоста, Incus или Пристрелки нет в Prometheus", description: "Цель из file_sd пропала целиком: файл /etc/prometheus/targets/*.yml опустел или удалён. up == 0 при этом не бывает, поэтому остальные тревоги молчат.", threshold: "держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-scrape-target-missing", __dashboardUid__: "samoylove-overview", __panelId__: "26" }

      - uid: mon-prometheus-ingestion-stopped
        title: "Мониторинг: Prometheus не пишет точки"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: 'sum(rate(prometheus_tsdb_head_samples_appended_total[5m])) == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: monitoring }
        annotations: { summary: "Prometheus перестал записывать точки", description: "Сбор встал целиком: все панели замерли, а тревоги смотрят на устаревшие данные. Журнал контейнера samoylove-prometheus.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-prometheus-ingestion-stopped", __dashboardUid__: "samoylove-overview", __panelId__: "46" }

      - uid: mon-prometheus-tsdb-failures
        title: "Мониторинг: хранилище Prometheus сбоит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: '(increase(prometheus_tsdb_compactions_failed_total[1h]) + increase(prometheus_tsdb_wal_corruptions_total[1h]) + increase(prometheus_tsdb_wal_writes_failed_total[1h])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Сбои уплотнения или журнала TSDB Prometheus", description: "Хранилище Prometheus портится: сбой уплотнения или журнала WAL. История может пропасть — смотреть журнал контейнера и место на томе.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-prometheus-tsdb-failures", __dashboardUid__: "samoylove-overview", __panelId__: "54" }

      - uid: mon-prometheus-tsdb-near-limit
        title: "Мониторинг: хранилище Prometheus почти у лимита"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              expr: 'prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes > 0.85'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "TSDB занимает больше 85% лимита размера", description: "Упёршись в лимит размера, Prometheus молча удаляет историю раньше 90 дней. 19.09.2026 было занято 8%.", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 85%, держится 1 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-prometheus-tsdb-near-limit", __dashboardUid__: "samoylove-overview", __panelId__: "48" }

      - uid: mon-grafana-scheduler-behind
        title: "Мониторинг: Grafana не успевает вычислять тревоги"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              expr: 'grafana_alerting_scheduler_behind_seconds > 30'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Планировщик тревог Grafana отстаёт больше чем на 30 секунд", description: "Тревоги вычисляются с опозданием на столько же, насколько отстаёт планировщик.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 30 с, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-grafana-scheduler-behind", __dashboardUid__: "samoylove-overview", __panelId__: "50" }

      - uid: mon-scrape-near-timeout
        title: 'Мониторинг: сбор цели почти упирается в таймаут'
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: (scrape_duration_seconds / scrape_timeout_seconds > 0.8) and on(job,instance) (up == 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - -1000000000
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
          area: monitoring
        annotations:
          summary: Сбор {{ $labels.job }} занимает больше 80% таймаута
          description: Цель {{ $labels.job }} / {{ $labels.instance }} тратит более 80% собственного таймаута. Проверить нагрузку экспортёра и давление ресурсов. Упавшая цель контролируется
            отдельной тревогой; увеличение таймаута не устраняет причину.
          value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}'
          threshold: Более 80% таймаута, 15 минут
          runbook_url: https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#mon-scrape-near-timeout
          __dashboardUid__: samoylove-reliability
          __panelId__: '14'

  - orgId: 1
    name: infra-reliability
    folder: Alerts
    interval: 1m
    rules:
      - uid: hw-root-space-warning
        title: 'Сервер: заканчивается запас места на системном диске'
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: (node_filesystem_avail_bytes{job=~"node|node-host",mountpoint="/"} / node_filesystem_size_bytes{job=~"node|node-host",mountpoint="/"} < 0.15) and (node_filesystem_avail_bytes{job=~"node|node-host",mountpoint="/"}
                < 40 * 1024^3) and (node_filesystem_avail_bytes{job=~"node|node-host",mountpoint="/"} / node_filesystem_size_bytes{job=~"node|node-host",mountpoint="/"} >= 0.10)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - -1000000000
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          area: server
          severity: warning
        annotations:
          summary: 'Сервер: заканчивается запас места на системном диске'
          description: 'Цель {{ $labels.job }}: проверить рост данных и квоту. Удаление версии контента требует сверки активных манифестов; снапшоты могут удерживать удалённые блоки. При
            менее 10% вместо этого предупреждения действует критический алерт.'
          threshold: Менее 15% и 40 ГиБ, но не ниже аварийного порога 10%; 30 минут
          value: '{{ if $values.A }}{{ $values.A.Value }}{{ else }}нет данных{{ end }}'
          runbook_url: https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-root-space-warning
          __dashboardUid__: samoylove-reliability
          __panelId__: '31'
      - uid: hw-win-system-disk-low
