        annotations: { summary: "Очередь разбора не убывает, а разборов не происходит вовсе", description: "Демки лежат, разбора нет ни у кого: у игрока страница матча вечно показывает «разбирается». Обычная причина — обновление игры сломало парсер; вторая — воркеры не поднялись после выкатки. Отказ выглядит как тишина, а не как ошибка.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-queue-stuck", __dashboardUid__: "samoylove-cs2", __panelId__: "300" }
