        for: 30m
        labels: { severity: warning, area: server }
        annotations: { summary: "Windows расходует подкачку при нехватке доступной физической памяти", description: "Непрерывно полчаса доступно менее 10% RAM, объём committed превышает физическую память и счётчик страничного ввода-вывода растёт быстрее 1000 страниц/с. Committed — обязательство выделить память, а не занятая RAM; Pages/sec включает чтение и запись, в том числе отображённых файлов, поэтому без нехватки доступной памяти тревоги нет. Проверить процессы Windows и их рабочие наборы. Память машины автоматически не увеличивать.", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }} физической{{ else }}нет данных{{ end }}', threshold: "Доступно менее 10% RAM, committed выше физической и более 1000 страниц/с, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-win-commit-over-physical", __dashboardUid__: "samoylove-hardware", __panelId__: "74" }

      # Обновления безопасности хоста (30.09.2026). Метрики пишет таймер пакета
      # prometheus-node-exporter-collectors (apt.prom). unattended-upgrades
      # ставит обновления безопасности раз в сутки, поэтому ожидающее
      # обновление само по себе норма; двое суток подряд — значит, установка
      # не идёт. Отложенные apt («held», чаще всего метапакеты, которым нужен
      # новый пакет) вычитаются: их unattended-upgrades не ставит, и тревога о
      # них горела бы вечно. Нулевых рядов пакет не пишет — отсюда
      # «or vector(0)», иначе min_over_time не увидел бы дней без обновлений.
      - uid: hw-security-updates-pending
        title: "Сервер: обновления безопасности не ставятся"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: 'min_over_time(((sum(apt_upgrades_pending{job="node-host",origin=~".*-security.*"}) or vector(0)) - (sum(apt_upgrades_held{job="node-host",origin=~".*-security.*"}) or vector(0)))[2d:15m]) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, area: server }
        annotations: { summary: "На хосте двое суток ждут обновления безопасности", description: "unattended-upgrades ставит обновления безопасности каждый день, а эти ждут уже двое суток: установка падает или стоит. На хосте: apt list --upgradable, journalctl -u apt-daily-upgrade, /var/log/unattended-upgrades/unattended-upgrades.log. Отложенные пакеты (held) сюда не входят, их видно на панели отдельно.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0 все двое суток, держится 1 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-security-updates-pending", __dashboardUid__: "samoylove-hardware", __panelId__: "87" }

      # Хосту нужна перезагрузка (30.09.2026): /var/run/reboot-required, метрика
      # из того же apt.prom. Перезагрузку хоста решает владелец — она гасит
      # прод, CI и игры, — поэтому это напоминание, а не авария: неделя без
      # перезагрузки после обновления ядра или libc.
      - uid: hw-reboot-required
        title: "Сервер: хосту неделю нужна перезагрузка"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: 'min_over_time((max(node_reboot_required{job="node-host"}) or vector(0))[7d:1h]) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, area: server }
        annotations: { summary: "Установленные обновления неделю ждут перезагрузки хоста", description: "После обновления ядра или системных библиотек хост неделю не перезагружался, и исправления не действуют. Что именно ждёт: cat /var/run/reboot-required.pkgs на хосте. Перезагрузка гасит прод, CI и игры, время выбирает владелец; после неё проверить, что поднялись все инстансы с автозапуском.", threshold: "держится 7 сут", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-reboot-required", __dashboardUid__: "samoylove-hardware", __panelId__: "88" }

  - orgId: 1
    name: infra-services
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-service-down
        title: "Сайты: служба в контейнере web не работает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(node_systemd_unit_state{job!=\"node-containers\",name=~\"(snakes|chillhub-api|chillhub-admin|nginx|docker)\\\\.service\",state=\"active\"} == 0) unless on(name) label_replace((deploy_maintenance_until_seconds{unit!=\"\"} > time()), \"name\", \"$1\", \"unit\", \"(.+)\")"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: sites }
        annotations: { summary: "Служба {{ $labels.name }} не active", description: "nginx и docker держат все сайты; snakes и chillhub — свои проекты. systemctl status внутри web.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-service-down", __dashboardUid__: "samoylove-overview", __panelId__: "25" }

      - uid: infra-unit-failed
        title: "Сайты: юнит в контейнере web упал"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(node_systemd_unit_state{job!=\"node-containers\",state=\"failed\"} == 1) unless on(name) label_replace((deploy_maintenance_until_seconds{unit!=\"\"} > time()), \"name\", \"$1\", \"unit\", \"(.+)\")"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: sites }
        annotations: { summary: "Юнит {{ $labels.name }} в состоянии failed", description: "Разовая задача (резервная копия, агент) закончилась ошибкой. journalctl -u внутри web.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-unit-failed", __dashboardUid__: "samoylove-overview", __panelId__: "25" }

      - uid: infra-monitoring-exporter-down
        title: "Мониторинг: экспортёр проб или журналов не отвечает"
        condition: C
        data:
          - refId: A
            # ServiceDown/UnitFailed смотрят на systemd-юниты хоста, а не на
            # контейнеры самого стека мониторинга — упавший blackbox-exporter
            # или nginxlog-exporter не задел бы ни один systemd-юнит и остался
            # бы незамеченным: SiteDown и посещаемость просто замрут на
            # последнем значении молча, без единого алерта.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "up{job=\"nginxlog\"} == 0 or (count(up{job=\"blackbox-http\"} == 0) == count(up{job=\"blackbox-http\"}))"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: monitoring }
        annotations: { summary: "Prometheus не может собрать {{ $labels.job }}: данные за ним устарели", description: "Пока экспортёр молчит, тревоги доступности и посещаемости сайтов слепы. docker ps в web — жив ли контейнер samoylove-blackbox или samoylove-nginxlog.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-monitoring-exporter-down", __dashboardUid__: "samoylove-overview", __panelId__: "26" }

