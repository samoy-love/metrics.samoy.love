        annotations: { summary: "p95 времени разбора перевалил за две минуты", description: "Сервис обещает разбор «под минуту»: человек, приславший демку, за две минуты обычно уходит со страницы. Смотреть, кто из двух парсеров стал узким местом, и не мешает ли разбору пересчёт архива.", __dashboardUid__: "samoylove-cs2", __panelId__: "306" }
      - uid: cs2-outdated
