              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Больше 20% разборов кончаются ошибкой", description: "Каждый пятый игрок вместо отчёта видит «разбор не удался». Отдельная и худшая причина — потеря синхронизации парсера с битовым потоком: такой матч не падает, а отдаёт правдоподобные, но неверные числа, поэтому расхождение считается отказом намеренно.", __dashboardUid__: "samoylove-cs2", __panelId__: "307" }
      - uid: cs2-parse-slow
