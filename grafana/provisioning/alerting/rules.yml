        annotations: { summary: "Строки журнала nginx не разбираются экспортёром", description: "log_format nginx и формат экспортёра разошлись: посещаемость и пятисотки по сайтам перестали считаться.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-access-log-parse-failing", __dashboardUid__: "samoylove-overview", __panelId__: "34" }

      - uid: product-event-receiver-errors
