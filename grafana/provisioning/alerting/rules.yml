        annotations: { summary: "На машине рендера меньше 10 ГиБ свободного места (машина — метка engine)", description: "Ниже 8 ГиБ в каталоге клипов сборщик начнёт стирать клипы раньше срока, ниже 2 ГиБ где угодно машина перестанет брать задания, и клипов не получит никто. На cs2-win смотреть оба диска: Z: (клипы) и C: (дорожки, кэш демок). Это не квота датасета tank/cs2-clips — про неё отдельная тревога «место под клипы кончается».", value: '{{ if $values.A }}{{ humanize1024 $values.A.Value }}Б{{ else }}нет данных{{ end }}', threshold: "меньше 10 ГиБ, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-machine-space-low", __dashboardUid__: "samoylove-cs2", __panelId__: "912" }
