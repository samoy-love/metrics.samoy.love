                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          area: monitoring
          severity: warning
        annotations:
          summary: 'Мониторинг: состояние Docker не обновляется'
          description: Проверить monitoring-containers-collect.timer и журнал одноимённой службы в машине со стеком. Ошибка сбора не означает нулевую память контейнера.
