        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} probe takes longer than 3 seconds", __dashboardUid__: "samoylove-overview", __panelId__: "30" }

      - uid: infra-status-check-down
        title: StatusCheckDown
        condition: C
        data:
          - refId: A
            # SiteDown видит только корень шести доменов. Агент статус-страницы
            # держит 14 более узких проверок — API манифестов лаунчера, путь
            # обновления, service worker метро, мини-приложение бота — и они
            # видны только на дашборде: провалившийся launcher-api при живом
            # launcher.samoy.love раньше не будил никого.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: status_check_up == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, source: textfile }
        annotations: { summary: "{{ $labels.project }} / {{ $labels.name }} check is down", __dashboardUid__: "samoylove-status", __panelId__: "12" }

  - orgId: 1
    name: product-sites
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-site-error-rate-high
        title: SiteErrorRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum by (host) (rate(samoylove_site_http_response_count_total{status=~"5.."}[15m]))
                  /
                sum by (host) (rate(samoylove_site_http_response_count_total[15m])) > 0.05
                and
                sum by (host) (increase(samoylove_site_http_response_count_total[15m])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.host }}: more than 5% of responses are 5xx", __dashboardUid__: "samoylove-overview", __panelId__: "10" }

      - uid: product-traffic-collapse
        title: TrafficCollapse
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h]))
                  <
                0.2 * sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w))
                and
                sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w)) > 50
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }}: traffic is five times lower than a week ago", __dashboardUid__: "samoylove-overview", __panelId__: "32" }

      - uid: product-site-latency-high
        title: SiteLatencyHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # path!="/downloads/": скачивание инсталлятора лаунчера — это
              # передача файла, а не обработка запроса, его request_time растёт
              # вместе с размером файла и медленным каналом клиента. Трафик
              # лаунчера редкий, поэтому пара таких скачиваний в окне целиком
              # определяют p95 и будят алерт без всякой деградации сайта.
              expr: histogram_quantile(0.95, sum by (le, host) (rate(samoylove_site_http_response_time_seconds_hist_bucket{path!="/downloads/"}[15m]))) > 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }}: p95 response time above one second", __dashboardUid__: "samoylove-overview", __panelId__: "33" }

      - uid: product-access-log-parse-failing
        title: AccessLogParseFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: increase(samoylove_site_parse_errors_total[30m]) > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "nginx log lines are not parsed — log_format and exporter format have diverged", __dashboardUid__: "samoylove-overview", __panelId__: "34" }

  - orgId: 1
    name: product-chillhub
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-install-failure-rate-high
        title: InstallFailureRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(increase(chillhub_game_installs_total{result!="ok"}[1h]))
                  /
                clamp_min(sum(increase(chillhub_game_installs_total[1h])), 1) > 0.4
                and
                sum(increase(chillhub_game_installs_total[1h])) >= 5
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: critical }
        annotations: { summary: "More than 40% of installs in the last hour did not finish", __dashboardUid__: "samoylove-chillhub", __panelId__: "39" }

      - uid: product-diff-updates-not-working
        title: DiffUpdatesNotWorking
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(increase(chillhub_game_updates_total{result="ok",mode="full"}[6h]))
                  /
                clamp_min(sum(increase(chillhub_game_updates_total{result="ok"}[6h])), 1) > 0.8
                and
                sum(increase(chillhub_game_updates_total{result="ok"}[6h])) >= 5
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Over 80% of updates downloaded the full build — diff savings are gone", __dashboardUid__: "samoylove-chillhub", __panelId__: "40" }

      - uid: product-hash-mismatches-high
        title: HashMismatchesHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_hash_mismatches_total[1h])) > 10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than ten files failed to match the manifest within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

      - uid: product-launcher-error-rate-high
        title: LauncherErrorRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(rate(chillhub_http_requests_total{code=~"5.."}[15m]))
                  /
                clamp_min(sum(rate(chillhub_http_requests_total[15m])), 0.001) > 0.05
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "More than 5% of launcher responses are 5xx", __dashboardUid__: "samoylove-chillhub", __panelId__: "41" }

      - uid: product-telemetry-rejected
        title: TelemetryRejected
        condition: C
        data:
          - refId: A
            # unknown_game исключён намеренно. Этот алерт задуман про НАШУ
            # поломку — разъехавшийся контракт после выкатки клиента или
            # переполненный диск. Отказ unknown_game означает обратное:
            # защита из gameid.go сработала и выкинула чужой мусор.
            #
            # На /metrics/report постоянно приходит поток чужих POST с
            # выдуманными gameId (случайный hex, UA лаунчера, пачки по пять с
            # ротацией адресов — ровно под лимитом 30/мин на адрес). За месяц
            # это ЕДИНСТВЕННАЯ причина отказов, то есть алерт ни разу не
            # сказал ничего про лаунчер и будил на штатной работе защиты.
            # Поток чужого мусора ловит отдельный TelemetryJunkFlood ниже.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_telemetry_rejected_total{reason!="unknown_game"}[1h])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "More than 20 rejected calls to /metrics/report from the launcher within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "999" }

      - uid: product-telemetry-junk-flood
        title: TelemetryJunkFlood
        condition: C
        data:
          - refId: A
            # Чужие отчёты с выдуманным gameId — фон, а не событие: сотня в
            # сутки прилетает постоянно и не значит ничего, отказ стоит
            # разбора JSON и строчки в логе. Порог поэтому на порядок выше
            # фона: интересен не сам мусор, а его всплеск — попытка засыпать
            # ручку или продавить кардинальность меток.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_telemetry_rejected_total{reason="unknown_game"}[1h])) > 500
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "More than 500 reports with an unknown gameId within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "999" }

      - uid: product-maintenance-mode-stuck
        title: MaintenanceModeStuck
        condition: C
        data:
          - refId: A
            # 30 минут, а не мгновенно: включение на время реальной публикации
            # законно и не должно будить никого. Забытым включённым он
            # становится позже — и выглядит для пользователей как поломка
            # сайта, хотя сервис жив.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(chillhub_maintenance_enabled) == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Maintenance mode has been on for over 30 minutes — public API is serving a stub", __dashboardUid__: "samoylove-chillhub", __panelId__: "6" }

      - uid: product-chillhub-admin-error-rate-high
        title: ChillhubAdminErrorRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Порог выше, чем у LauncherErrorRateHigh: трафик админки низкий
              # и однопользовательский, доля скачет сильнее на тех же
              # абсолютных числах — 5% здесь ловило бы шум, не аварию.
              expr: |
                100 * sum(rate(chillhub_http_requests_total{service="admin",code=~"5.."}[15m]))
                  /
                clamp_min(sum(rate(chillhub_http_requests_total{service="admin"}[15m])), 0.001) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than 20% of admin panel responses are 5xx", __dashboardUid__: "samoylove-chillhub", __panelId__: "42" }

      - uid: product-chillhub-client-errors-high
        title: ChillhubClientErrorsHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_client_errors_total[1h])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than 20 client-side errors reported by the launcher within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

  - orgId: 1
    name: product-status
    folder: Alerts
