      # --- Рендер клипов (план cs2 29Д). Очередь лежит в той же базе, что и
      # всё остальное, и метрики по ней считает cs2-api, а не сам работник в
      # контейнере cs2-render: у того своей мишени сборщика нет.

      - uid: cs2-render-disk-unknown
        title: 'Пристрелка: машина не измеряет свободное место'
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (cs2_render_heartbeat_age_seconds < 180) unless on(engine) cs2_render_clips_free_bytes
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - -1000000000
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          area: cs2
        annotations:
          summary: Живая машина {{ $labels.engine }} не измеряет свободное место
          description: Неизвестное место не означает достаточный запас. Проверить доступность каталогов клипов, работы и кэша под учётной записью работника. Windows должна использовать GetDiskFreeSpaceExW. Задания остаются в очереди до успешного замера.
          value: неизвестно
          threshold: нет замера у живой машины 5 минут
          runbook_url: https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-disk-unknown
          __dashboardUid__: samoylove-cs2
          __panelId__: '912'
      - uid: cs2-render-disk-low
        title: 'Пристрелка: на машине рендера мало места'
        condition: C
