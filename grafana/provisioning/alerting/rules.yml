              # с 10 до 29 ГБ при тех же 66 демках — временные файлы, а не
              # новые матчи, — и шестичасовое окно продолжило этот час на две
              # недели: правило горело два часа на пустом месте. Всплеск
              # короче двух часов минимум не видит вовсе, а настоящий рост
              # демками от него не прячется — демки не удаляются.
              expr: 'predict_linear(min_over_time(cs2_demo_storage_used_bytes[2h])[3d:10m], 14*24*3600) > cs2_demo_storage_total_bytes - 10 * 1024^3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: info, area: cs2 }
        annotations: { summary: "При нынешнем темпе места под демки хватит меньше чем на две недели", description: "Наклон взят по последним трём дням (без всплесков короче двух часов) и продолжен на две недели — это повод посмотреть, а не тревога: неделя активной игры задирает темп, а неделя без игры его обнуляет. Настоящий остаток — в правиле «место под демки кончается».", threshold: "держится 1 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-demo-storage-forecast", __dashboardUid__: "samoylove-cs2", __panelId__: "705" }
      - uid: cs2-worker-silent
        title: "Пристрелка: работник цепочки молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ВЫКЛЮЧЕННЫЕ ОТСЕИВАЮТСЯ, А НЕ ВКЛЮЧЁННЫЕ ОТБИРАЮТСЯ. Метрика
              # cs2_worker_enabled есть только у работников с рубильником, и
              # отбор по ней выбрасывал «разбор» — того единственного, чьё
              # молчание и значит, что матчи не разбираются.
              #
              # ОЧЕРЕДЬ НЕПУСТА ВСЕ ШЕСТЬ ЧАСОВ, А НЕ ПРЯМО СЕЙЧАС (27.09.2026).
              # Последний успех после тихой ночи старше шести часов у всех, и
              # прежнее «очередь > 0» горело через полчаса после первого же
              # нового матча: доставка по замыслу держит разбор час после
              # конца сессии (и до получаса ждёт авто-клип), а тревога уже
              # звала чинить исправного работника. Застрял — значит, дела
              # ждали его всё это время и он не сделал ни одного.
              expr: |
                (time() - cs2_worker_last_success_timestamp_seconds{worker!="доставка"} > 21600)
                and on(worker) min_over_time(cs2_worker_backlog[6h]) > 0
                unless on(worker) cs2_worker_enabled == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Работник {{ $labels.worker }} шесть часов не сделал ни одного дела, хотя его ждут дела", description: "Работник запущен, очередь у него непустая (cs2_worker_backlog), а следов работы в базе шесть часов нет: круг падает молча. Для игрока это затор в цепочке без единой ошибки в журнале. Тишина при пустой очереди — норма (никто не играл) и тревогой не считается: до 11.09.2026 правило этого не различало и горело весь вечер. Очередь при этом должна быть непустой все шесть часов: дела, появившиеся после тихой ночи, работник ещё не обязан был сделать (с 27.09.2026). Доставка исключена: сводки штатно ждут окончания сессии, клипа и тихих часов. Её задержку проверяет cs2-chain-waiting по просроченному сроку отправки, а не времени последней отправки.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-worker-silent", __dashboardUid__: "samoylove-cs2", __panelId__: "401" }
      - uid: cs2-worker-mark-silent
        title: "Пристрелка: фоновый работник молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Работники с отметкой удачного круга в service_marks (worker:<имя>), у
              # которых нет очереди: общее правило «работник цепочки молчит» требует
              # непустой cs2_worker_backlog и их не видит. Порог у каждого — не меньше
              # двух пропущенных кругов, чтобы одна заминка чужой стороны не будила
              # (МЕТРИКИ.md, «Работники и их отметки»):
              #   блокировки, уровни, профили — круг час, порог три часа; у частей
              #     рубильник один, cs2_worker_enabled{worker="профили"};
              #   faceit — круг полчаса, порог два часа;
              #   друзья — долгий опрос 25 с, порог 15 минут;
              #   пересчёт — круг 15 минут, порог час;
              #   аватары — проход раз в сутки на сайте, порог 50 часов, рубильника нет.
              # профиль_вошедшего не тревожит намеренно: сбор идёт, только когда человек
              # входит или жмёт «обновить», и тишина значит «никто не входил».
              # Ряд, оставшийся от времени, когда ключ был, не будит: сверка с
              # cs2_worker_enabled того же работника.
              expr: |
                (
                  (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker=~"блокировки|уровни|профили"}) > 10800)
                    and on() (max(cs2_worker_enabled{worker="профили"}) == 1)
                )
                or (
                  (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker="faceit"}) > 7200)
                    and on(worker) (max by (worker) (cs2_worker_enabled{worker="faceit"}) == 1)
                )
                or (
                  (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker="друзья"}) > 900)
                    and on(worker) (max by (worker) (cs2_worker_enabled{worker="друзья"}) == 1)
                )
                or (
                  (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker="пересчёт"}) > 3600)
                    unless on(worker) (max by (worker) (cs2_worker_enabled{worker="пересчёт"}) == 0)
                )
                or (time() - max by (worker) (cs2_worker_last_success_timestamp_seconds{worker="аватары"}) > 180000)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Работник {{ $labels.worker }} давно не отметил ни одного удачного круга", description: "Сайт отвечает, но данные этого работника перестали свежеть: блокировки, уровни и профили — наблюдения о встреченных и профили игроков; faceit — ELO на профилях; друзья — матчи через бота в друзьях приходят только кругом кодов, с опозданием; пересчёт — старые числа на страницах после смены разбора; аватары — кэш аватаров растёт без уборки. Смотреть журнал cs2-chain (у аватаров — cs2-api) по имени работника: круг падает молча или обрывается отказом чужой стороны.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-worker-mark-silent", __dashboardUid__: "samoylove-cs2", __panelId__: "401" }
      - uid: cs2-worker-mark-absent
        title: "Пристрелка: запущенный работник ни разу не отметился"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Отметки нет вовсе — ряда cs2_worker_last_success_timestamp_seconds у
              # работника нет, хотя cs2_worker_enabled говорит, что он запущен. Правило
              # выше такой случай не видит: сравнивать не с чем. Шесть часов — больше
              # любого круга из списка выше, кроме аватаров (у них рубильника нет,
              # и отсутствие их ряда видно на панели). Если молчит вся цепочка, рядом
