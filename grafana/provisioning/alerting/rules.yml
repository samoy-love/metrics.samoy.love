        title: "Сервер: снимки ZFS не делались больше суток"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              expr: '((time() - zfs_snapshot_newest_timestamp_seconds{job="node-host"}) > 28*3600) or (zfs_snapshot_collect_ok{job="node-host"} == 0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, area: server }
        annotations: { summary: "Самому свежему снимку sanoid датасета {{ $labels.dataset }} больше 28 часов", description: "Снимки делаются раз в сутки, значит, последний прогон sanoid этот датасет не снял, и точки отката за сегодня нет. На хосте: systemctl status sanoid.timer sanoid.service, journalctl -u sanoid, zfs list -t snapshot -o name,creation -s creation <датасет>. Если метки dataset нет, сборщик не смог прочитать sanoid.conf или список снимков: journalctl -u node-textfile-collect.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "старше 28 ч, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-snapshots-stale", __dashboardUid__: "samoylove-hardware", __panelId__: "85" }

      - uid: hw-win-commit-over-physical
