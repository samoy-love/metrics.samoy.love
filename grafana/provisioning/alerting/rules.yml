  - orgId: 1
    name: product-sites
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-site-error-rate-high
        title: SiteErrorRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum by (host) (rate(samoylove_site_http_response_count_total{status=~"5.."}[15m]))
                  /
                sum by (host) (rate(samoylove_site_http_response_count_total[15m])) > 0.05
                and
                sum by (host) (increase(samoylove_site_http_response_count_total[15m])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.host }}: more than 5% of responses are 5xx", __dashboardUid__: "samoylove-overview", __panelId__: "10" }

      - uid: product-traffic-collapse
        title: TrafficCollapse
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h]))
                  <
                0.2 * sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w))
                and
                sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w)) > 50
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }}: traffic is five times lower than a week ago", __dashboardUid__: "samoylove-overview", __panelId__: "32" }

      - uid: product-site-latency-high
        title: SiteLatencyHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ИСКЛЮЧЕНЫ ОБА ПУТИ, ПО КОТОРЫМ ОТДАЮТСЯ ФАЙЛЫ. Скачивание — это
              # передача, а не обработка запроса: request_time растёт вместе с
              # размером файла и медленным каналом клиента, а не с нагрузкой на
              # сервер. Пара таких запросов в окне целиком определяет p95 и
              # будит алерт без всякой деградации сайта.
              #
              # /downloads/ — установщик лаунчера, был исключён сразу.
              # /content/ — раздача самих игр, добавлено 04.09.2026. Исключили
              # редкое, а шумело частое: за шесть часов /downloads/ дал 10
              # запросов с p95 = 0.00 с, а /content/ — 2412 запросов с
              # p95 = 5.00 с. Из-за этого SiteLatencyHigh за один день
              # сработал трижды, и с учётом сообщений о восстановлении и
              # картинок это двенадцать сообщений в чат — ни об одной
              # настоящей проблеме.
              # /clips/video/ и /admin/vnc/ — Пристрелка, добавлено 18.09.2026.
              # Те же грабли: видео клипов качается минутами, а websockify
              # экрана рендера держит соединение весь сеанс. 15.09 это дало
              # три ложных SiteLatencyHigh у cs.samoy.love за вечер.
              expr: histogram_quantile(0.95, sum by (le, host) (rate(samoylove_site_http_response_time_seconds_hist_bucket{path!~"/downloads/|/content/|/clips/video/|/admin/vnc/"}[15m]))) > 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }}: p95 response time above one second", __dashboardUid__: "samoylove-overview", __panelId__: "33" }

      - uid: product-access-log-parse-failing
        title: AccessLogParseFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: increase(samoylove_site_parse_errors_total[30m]) > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "nginx log lines are not parsed — log_format and exporter format have diverged", __dashboardUid__: "samoylove-overview", __panelId__: "34" }

  - orgId: 1
    name: product-chillhub
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-install-failure-rate-high
        title: InstallFailureRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(increase(chillhub_game_installs_total{result!="ok"}[1h]))
                  /
                clamp_min(sum(increase(chillhub_game_installs_total[1h])), 1) > 0.4
                and
                sum(increase(chillhub_game_installs_total[1h])) >= 5
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: critical }
        annotations: { summary: "More than 40% of installs in the last hour did not finish", __dashboardUid__: "samoylove-chillhub", __panelId__: "39" }

      - uid: product-diff-updates-not-working
        title: DiffUpdatesNotWorking
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(increase(chillhub_game_updates_total{result="ok",mode="full"}[6h]))
                  /
                clamp_min(sum(increase(chillhub_game_updates_total{result="ok"}[6h])), 1) > 0.8
                and
                sum(increase(chillhub_game_updates_total{result="ok"}[6h])) >= 5
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "Over 80% of updates downloaded the full build — diff savings are gone", __dashboardUid__: "samoylove-chillhub", __panelId__: "40" }

      - uid: product-hash-mismatches-high
        title: HashMismatchesHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_hash_mismatches_total[1h])) > 10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than ten files failed to match the manifest within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

      - uid: product-launcher-error-rate-high
        title: LauncherErrorRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum(rate(chillhub_http_requests_total{code=~"5.."}[15m]))
                  /
                clamp_min(sum(rate(chillhub_http_requests_total[15m])), 0.001) > 0.05
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "More than 5% of launcher responses are 5xx", __dashboardUid__: "samoylove-chillhub", __panelId__: "41" }

      - uid: product-telemetry-rejected
        title: TelemetryRejected
        condition: C
        data:
          - refId: A
            # unknown_game исключён намеренно. Этот алерт задуман про НАШУ
            # поломку — разъехавшийся контракт после выкатки клиента или
            # переполненный диск. Отказ unknown_game означает обратное:
            # защита из gameid.go сработала и выкинула чужой мусор.
            #
            # На /metrics/report постоянно приходит поток чужих POST с
            # выдуманными gameId (случайный hex, UA лаунчера, пачки по пять с
            # ротацией адресов — ровно под лимитом 30/мин на адрес). За месяц
            # это ЕДИНСТВЕННАЯ причина отказов, то есть алерт ни разу не
            # сказал ничего про лаунчер и будил на штатной работе защиты.
            # Поток чужого мусора ловит отдельный TelemetryJunkFlood ниже.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_telemetry_rejected_total{reason!="unknown_game"}[1h])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "More than 20 rejected calls to /metrics/report from the launcher within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "999" }

      - uid: product-telemetry-junk-flood
        title: TelemetryJunkFlood
        condition: C
        data:
          - refId: A
            # Чужие отчёты с выдуманным gameId — фон, а не событие: сотня в
            # сутки прилетает постоянно и не значит ничего, отказ стоит
            # разбора JSON и строчки в логе. Порог поэтому на порядок выше
            # фона: интересен не сам мусор, а его всплеск — попытка засыпать
            # ручку или продавить кардинальность меток.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_telemetry_rejected_total{reason="unknown_game"}[1h])) > 500
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "More than 500 reports with an unknown gameId within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "999" }

      - uid: product-maintenance-mode-stuck
        title: MaintenanceModeStuck
        condition: C
        data:
          - refId: A
            # 30 минут, а не мгновенно: включение на время реальной публикации
            # законно и не должно будить никого. Забытым включённым он
            # становится позже — и выглядит для пользователей как поломка
            # сайта, хотя сервис жив.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: max(chillhub_maintenance_enabled) == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Maintenance mode has been on for over 30 minutes — public API is serving a stub", __dashboardUid__: "samoylove-chillhub", __panelId__: "6" }

      - uid: product-chillhub-admin-error-rate-high
        title: ChillhubAdminErrorRateHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Порог выше, чем у LauncherErrorRateHigh: трафик админки низкий
              # и однопользовательский, доля скачет сильнее на тех же
              # абсолютных числах — 5% здесь ловило бы шум, не аварию.
              expr: |
                100 * sum(rate(chillhub_http_requests_total{service="admin",code=~"5.."}[15m]))
                  /
                clamp_min(sum(rate(chillhub_http_requests_total{service="admin"}[15m])), 0.001) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than 20% of admin panel responses are 5xx", __dashboardUid__: "samoylove-chillhub", __panelId__: "42" }

      - uid: product-chillhub-client-errors-high
        title: ChillhubClientErrorsHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(chillhub_client_errors_total[1h])) > 20
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "More than 20 client-side errors reported by the launcher within an hour", __dashboardUid__: "samoylove-chillhub", __panelId__: "36" }

  - orgId: 1
    name: product-status
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-status-agent-stale
        title: StatusAgentStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: time() - status_agent_run_timestamp_seconds > 600
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, source: textfile }
        annotations: { summary: "Status page agent has not polled services for over 10 minutes", __dashboardUid__: "samoylove-status", __panelId__: "8" }

      - uid: product-status-bot-stale
        title: StatusBotStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: time() - statusbot_heartbeat_timestamp_seconds > 600
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        # critical, а не warning: молчащий heartbeat означает мёртвый бот
        # целиком — ни одно сообщение никуда не уйдёт. TelegramDeliveryFailing
        # рядом (бот жив, но не достучался до Telegram) остаётся critical по
        # той же причине — разводить их по severity было бы непоследовательно.
        labels: { severity: critical, source: textfile }
        annotations: { summary: "Telegram bot has not updated its metrics for over 10 minutes", __dashboardUid__: "samoylove-status", __panelId__: "17" }

      - uid: product-telegram-delivery-failing
        title: TelegramDeliveryFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: increase(statusbot_send_failures_total[1h]) > 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Bot cannot send messages: incident notifications will not arrive", __dashboardUid__: "samoylove-status", __panelId__: "18" }

  - orgId: 1
    name: product-snakes
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-snakes-profiles-read-only
        title: SnakesProfilesReadOnly
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: snakes_profiles_read_only == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Snakes profile storage is read-only — player progress will not survive a restart", __dashboardUid__: "samoylove-snakes", __panelId__: "27" }

      - uid: product-snakes-profile-saves-failing
        title: SnakesProfileSavesFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: increase(snakes_profiles_save_errors_total[30m]) > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Snakes cannot write profiles.json — progress is being lost", __dashboardUid__: "samoylove-snakes", __panelId__: "28" }

      - uid: product-snakes-ws-errors-high
        title: SnakesWsErrorsHigh
        condition: C
        data:
          - refId: A
            # Порог не откалиброван по реальным данным — начальная прикидка.
            # Если начнёт шуметь или, наоборот, молчать при заметных разрывах,
            # число 10 в минуту стоит пересмотреть по факту, а не вслепую.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                60 * (
                  sum(rate(snakes_ws_dropped_messages_total[10m]))
                    +
                  sum(rate(snakes_ws_write_errors_total[10m]))
                    +
                  sum(rate(snakes_ws_handshake_rejected_total[10m]))
                ) > 10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "More than 10 WebSocket failures per minute — players are getting dropped", __dashboardUid__: "samoylove-snakes", __panelId__: "23" }

      - uid: product-snakes-tick-slow
        title: SnakesTickSlow
        condition: C
        data:
          - refId: A
            # 100ms — прикидка бюджета тика, не измеренный факт. Как и порог
            # выше, стоит сверить с реальным p95 после недели наблюдений.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: histogram_quantile(0.95, sum(rate(snakes_tick_duration_seconds_bucket[10m])) by (le)) > 0.1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Game tick p95 is over budget — every player feels the lag", __dashboardUid__: "samoylove-snakes", __panelId__: "29" }

  # ═══════════════════════════════════════════════════════════════════════════
  # РАЗБОР МАТЧЕЙ CS2 — ЕДИНСТВЕННАЯ ГРУППА ПРАВИЛ ПО-РУССКИ, И ЭТО РЕШЕНИЕ
  # ВЛАДЕЛЬЦА ОТ 10.09.2026.
  #
  # Остальные группы выше остались на английском (см. шапку файла). Здесь
  # иначе: имя правила и текст — это то, что человек читает в чате ночью, и
  # читать он должен не «Cs2ChainStalled», а что именно сломалось и что от
  # этого не работает у игрока.
  #
  # У КАЖДОГО ПРАВИЛА ДВА ТЕКСТА, И ОНИ РАЗНЫЕ ПО НАЗНАЧЕНИЮ:
  #   summary     — что произошло, одной строкой;
  #   description — ЧТО ЭТО ЗНАЧИТ ДЛЯ ИГРОКА и что делать.
  # Второе важнее первого. Тревога, из которой не видно последствия, требует
  # похода в код, чтобы понять, надо ли вставать; а тревога, по которой не
  # встают, через месяц выключается вместе со всеми остальными.
  #
  # ЧЕГО ЗДЕСЬ НАМЕРЕННО НЕТ:
  #   • тревоги на cs2_chain_demos_expired — истёкшие демки лечению не
  #     подлежат, это учёт потерянного, а не повод будить. Смотреть вперёд
  #     обязана «Демки вот-вот исчезнут у Valve», у которой ещё есть время;
  #   • тревоги на лабораторный режим — он включён владельцем осознанно, и
  #     напоминать о нём каждые сутки значит приучить не читать;
  #   • тревоги на «профиль закрыт» в ответах Steam — это нормальный ответ
  #     про обычного человека с обычными настройками приватности.
  #
  # Демки хранятся ЦЕЛИКОМ, ретеншна нет: это осознанное решение, а не
  # недоделка. Значит место кончится, и единственная защита от того, чтобы это
  # случилось внезапно, — предупредить заранее. Датасет ограничен квотой ZFS,
  # поэтому переполнение остановит приём демок, а не заполнит общий пул, на
  # котором живут прод и сборочные машины.
  - orgId: 1
    name: product-cs2
    folder: Alerts
    interval: 1m
    rules:
      - uid: cs2-api-down
        title: "CS2: сайт не отвечает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'up{job="cs2-api"} == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Служба cs2-api не отвечает на сбор метрик", description: "Для игрока это полностью недоступный сайт: ни разбора, ни истории, ни входа. Смотреть journalctl -u cs2-api в контейнере cs2; выкатка откатывается сама, если не поднялся healthz.", __dashboardUid__: "samoylove-cs2", __panelId__: "100" }
      - uid: cs2-not-ready
        title: "CS2: сервис не подключился к базам"
        condition: C
        data:
          - refId: A
            # Порт слушается раньше баз намеренно — иначе медленный ClickHouse
            # откатывал бы исправный релиз. Отсюда и правило: «не готов» это
            # состояние, а не отсутствие сервиса.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_ready == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Сайт поднят, но Postgres или ClickHouse недоступны", description: "Человек видит страницу «сервис поднимается» и 503 везде, где нужны данные: разбор, профиль, поиск. Само чинится, когда база встанет; дольше десяти минут — значит база не поднимется без нас. Причина названа словами в /readyz.", __dashboardUid__: "samoylove-cs2", __panelId__: "402" }
      - uid: cs2-http-errors
        title: "CS2: страницы отвечают ошибками"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'sum(rate(cs2_http_requests_total{code=~"5.."}[15m])) / clamp_min(sum(rate(cs2_http_requests_total[15m])), 0.0001) > 0.05'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Больше 5% ответов сайта — пятисотки", description: "Каждая такая ответ — страница, которая у человека не открылась. Какой именно раздел ломается, видно на панели «Ошибки по разделам»: журнал nginx этого не покажет, он видит домен целиком.", __dashboardUid__: "samoylove-cs2", __panelId__: "109" }
      - uid: cs2-demos-expiring
        title: "CS2: демки вот-вот исчезнут у Valve"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_chain_demos_expiring_soon > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Есть матчи, у которых осталось меньше трёх дней окна хранения", description: "ЕДИНСТВЕННАЯ ТРЕВОГА ПРО БЕЗВОЗВРАТНУЮ ПОТЕРЮ. Valve держит демку около тридцати дней; не забранный сейчас матч не разобрать уже никогда — ни по просьбе игрока, ни за деньги. Проверить скачиватель: место на диске, связь с CDN, не выключен ли работник.", __dashboardUid__: "samoylove-cs2", __panelId__: "203" }
      - uid: cs2-gc-down
        title: "CS2: нет связи с сервером Valve"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_gc_ready == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: critical }
        annotations: { summary: "Прослойка Game Coordinator не отвечает или потеряла сессию Steam", description: "Новые матчи перестают приходить сами: у игрока в истории остаётся «найден» и ничего дальше, при этом сайт выглядит здоровым. Причины по частоте: обновление CS2, отозванный токен, бан серверного аккаунта. Загрузка демки руками продолжает работать.", __dashboardUid__: "samoylove-cs2", __panelId__: "200" }
      - uid: cs2-gc-unparsed
        title: "CS2: ответы сервера Valve перестали разбираться"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'increase(cs2_gc_requests_total{result="не_разобран"}[1h]) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Game Coordinator отвечает, но разобрать ответ мы не можем", description: "Так выглядит очередной апдейт CS2 — тот самый постоянный налог. Пока не починим имена полей, у всех игроков матчи стоят на стадии «найден»: счёт не приходит, демка не скачивается, разбора нет. Сырой ответ пишется в журнал целиком — по нему и правится.", __dashboardUid__: "samoylove-cs2", __panelId__: "207" }
      - uid: cs2-downloads-failing
        title: "CS2: демки не скачиваются с CDN Valve"
        condition: C
        data:
          - refId: A
            # ЭТО ПРАВИЛО ПЕРЕПИСАНО 10.09.2026 ПОСЛЕ ЛОЖНОГО СРАБАТЫВАНИЯ.
            # Прежнее смотрело на cs2_chain_demos_download_failed > 3 — счётчик
            # записей с непустой причиной. Оно зажглось в тот час, когда работник
            # впервые пометил словами семь августовских матчей, чьи файлы Valve
            # давно удалила: ни одного отказа сети не было, а счётчик не вернулся
            # бы к нулю НИКОГДА — истёкшая запись лежит в базе вечно.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'sum(rate(cs2_demo_download_total{result=~"нет_связи|обрыв"}[1h])) / clamp_min(sum(rate(cs2_demo_download_total[1h])), 0.0001) > 0.3 and sum(increase(cs2_demo_download_total[1h])) >= 3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Больше трети походов за файлом кончаются обрывом связи", description: "Матчи копятся нескачанными, а окно хранения у Valve — тридцать дней: затянувшийся отказ превращается в потерю навсегда. Считается ПО ПОПЫТКАМ, а не по состоянию в базе: состояние помнит и то, что случилось месяц назад и починке не подлежит.", __dashboardUid__: "samoylove-cs2", __panelId__: "208" }
      - uid: cs2-chain-waiting
        title: "CS2: матч ждёт разбора больше двух часов"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'max(cs2_chain_waiting_seconds) > 7200'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Самое старое дело в цепочке висит дольше двух часов", description: "Игрок доиграл, обновляет страницу и не видит разбора. Панель «Сколько ждёт игрок» показывает, на каком шаге затор: ждёт счёта — работник Game Coordinator, ждёт файла — скачиватель, ждёт разбора — воркер. Обещано «сам и сразу», а не «к утру».", __dashboardUid__: "samoylove-cs2", __panelId__: "106" }
      - uid: cs2-chain-stalled
        title: "CS2: цепочка встала"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                min_over_time(cs2_chain_codes_awaiting_summary[1h]) > 0
                and increase(cs2_chain_summaries[1h]) == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Коды матчей ждут счёта, а новых сводок за час не прибавилось", description: "Работа приходит и не уходит: у игроков матчи стоят на первой стадии. Ничего при этом не падает — сайт отвечает двухсотыми, ошибок в журнале нет. Ровно так поломку цепочки однажды нашёл живой игрок, а не проверка.", __dashboardUid__: "samoylove-cs2", __panelId__: "206" }
      - uid: cs2-summaries-failed
        title: "CS2: коды матчей закрыты с ошибкой"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 'cs2_chain_codes_summary_failed > 5'
              instant: true
              refId: A
