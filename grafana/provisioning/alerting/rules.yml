              expr: 'max by (worker) (cs2_worker_enabled{worker=~"профили|faceit|друзья|пересчёт"}) == 1 unless on(worker) max by (worker) (cs2_worker_last_success_timestamp_seconds)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 6h
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Работник {{ $labels.worker }} запущен, а удачного круга не отметил ни разу", description: "Либо работник падает на каждом круге с самого запуска, либо отметка в service_marks не пишется (нет прав, другая база). Для человека это то же, что молчащий работник: данные не свежеют. Смотреть журнал cs2-chain по имени работника и строку worker:{{ $labels.worker }} в service_marks.", threshold: "держится 6 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-worker-mark-absent", __dashboardUid__: "samoylove-cs2", __panelId__: "401" }
      - uid: cs2-queue-stuck
