              expr: 'cs2_render_mode_mismatch == 1 and on() cs2_service_mode{mode="public"} == 1'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: cs2 }
        annotations: { summary: "Машина рендера {{ $labels.engine }} в лабораторном режиме, а сервис публичный", description: "Ролики с этой машины кладут музыку, картинки и голоса без лицензии и уходят людям в публичный сервис. Сразу: остановить работника на этой машине (задания без камер уйдут другой), затем поставить CS2_MODE=public в её настройках и запустить снова. Уже снятые ролики с лабораторными ассетами найти по render_jobs этой машины после смены режима сервиса.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-lab-at-public", __dashboardUid__: "samoylove-cs2", __panelId__: "1602" }

      - uid: cs2-container-unit-failed
        title: "Пристрелка: в контейнере упала служба"
