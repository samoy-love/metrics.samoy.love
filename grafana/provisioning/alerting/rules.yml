                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Неделю подряд больше 5% промо снимаются уже после сводки сессии", description: "Опоздавшее промо в Telegram не уходит: человек получает сводку без ролика. Две машины не справляются с вечерним пиком — пора третья (КОНСТРУКТОР-РОЛИКОВ, «Мощность рендера»). Сначала глянуть «Ожидание по классам» и «Машины рендера: отметка»: если одна машина всю неделю молчала, дело не в мощности.", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 12000%, держится 1 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-promo-late", __dashboardUid__: "samoylove-cs2", __panelId__: "1604" }
      - uid: cs2-clip-storage-low
        title: "Пристрелка: место под клипы кончается"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
