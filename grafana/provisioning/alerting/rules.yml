# Правила алертинга: инфраструктура и продуктовые метрики. Раньше это были
# prometheus/rules/infra.yml и product.yml, уходившие в отдельный Alertmanager
# (см. историю docker-compose.yml) — теперь Grafana сама и вычисляет правила,
# и шлёт в Telegram через grafana/provisioning/alerting/contactpoints.yml.
# С 29.09.2026 все правила по-русски и с меткой area (ci, server, cs2, sites,
# monitoring): имя правила и тексты читает человек в чате, а область решает,
# на какой светофор дашборда «Обзор» и в какой список тревог правило попадёт.
# Имя начинается с области («Сервер: …», «Пристрелка: …»), потому что в чате
# и в /alerting/list оно видно без папки и без меток.
#
# У каждого правила, кроме summary и description:
#   value        — текущее значение словами ($values.A), формат по единице панели;
#   threshold    — порог и сколько условие должно держаться;
#   runbook_url  — раздел docs/runbook.md (он собирается из этого файла:
#                  python3 ci/alerts.py --write-runbook);
#   __dashboardUid__ и __panelId__ — панель, на которую ведёт ссылка в сообщении.
# Всё это проверяет ci/alerts.py в CI: правило без области, панели или
# раздела runbook не пройдёт.
#
# ПОЧЕМУ У КАЖДОГО ПРАВИЛА УСЛОВИЕ "gt -1e9", А НЕ ПОРОГ ИЗ SUMMARY. Исходные
# PromQL-выражения — это фильтры Prometheus (`x < 0.10`, `x == 0`, `x == 1`):
# они возвращают ряд, только когда условие уже верно, а его ЗНАЧЕНИЕ при этом
# может быть чем угодно — долей от 0 до 1, точным нулём (`== 0`), единицей
# (`== 1`) или отрицательным числом (просроченный сертификат). Grafana же
# требует отдельный узел-условие, который сравнивает ЗНАЧЕНИЕ. Порог в
# -1 000 000 000 ниже любого реального значения во всех выражениях ниже, так
# что условие эквивалентно исходному «ряд есть — значит, авария»: считать
# срабатыванием сам факт, что фильтр Prometheus что-то вернул, а не то, что
# вернувшееся число больше нуля (иначе `== 0` никогда бы не сработало).
#
# ЧЕГО ЗДЕСЬ НЕТ. AlertmanagerDown и AlertNotificationsFailing (были в
# infra-alerting) не перенесены: обе проверяли отдельный Alertmanager, а его
# в стеке больше нет — Grafana теперь и вычисляет правила, и доставляет
# сообщения сама, так что проверять «жив ли Alertmanager» больше нечего.
# Самой Grafana, если она недоступна, тоже некому будет об этом сообщить —
# та же дыра, что была описана в исходном комментарии infra-alerting, и её
# закрывает внешняя проверка GitHub Actions (.github/workflows/ci.yml), а не
# правило внутри самого стека.
#
# inhibit_rules из alertmanager.yml (SiteDown гасит ProbeLatencyHigh по тому
# же instance, critical гасит warning по тому же alertname+instance) тоже не
# перенесены: у Grafana Alerting нет прямого аналога подавления одного
# алерта другим на уровне политики маршрутизации. Из трёх алертов про один
# упавший сайт (SiteDown, ProbeLatencyHigh, возможно SiteErrorRateHigh) в чат
# теперь придёт больше одного сообщения.

apiVersion: 1

# ПЕРЕИМЕНОВАНИЕ uid ПЛОДИТ ДУБЛИКАТ, А НЕ ЗАМЕНЯЕТ ПРАВИЛО.
#
# Выяснено на себе 10.09.2026, через семь минут после выкатки. Группа
# product-cs2 была переписана целиком, и вместе с текстами поменялись uid пяти
# правил. Grafana НЕ удаляет правила, которых не стало в файле: она завела
# новые, а старые остались в своей базе и продолжили слать в чат — старым
# английским именем и со старым, уже неверным порогом. То есть починка ложной
# тревоги ровно её и не починила бы, а вдобавок удвоила бы остальные.
#
# Отсюда два следствия. Первое: uid — это идентификатор, а не описание, и
# менять его при правке текста незачем. Второе: если он всё же поменялся,
# старый обязан быть назван здесь — другого способа убрать правило из Grafana,
# кроме как сказать об этом вслух, у провижининга нет.
deleteRules:
  - orgId: 1
    uid: hw-laptop-backup-missing
  - orgId: 1
    uid: hw-laptop-backup-old
  - orgId: 1
    uid: cs2-demo-downloads-failing
  - orgId: 1
    uid: cs2-gc-disconnected
  - orgId: 1
    uid: cs2-parse-failing
  - orgId: 1
    uid: cs2-summaries-unparsed
  - orgId: 1
    uid: cs2-codes-need-rebind
  # Это осталось от ещё более раннего захода: правило про медленный разбор
  # заводилось с uid, начинающимся с имени группы. Найдено сверкой списков, а
  # не глазами: глазами я нашёл только пять, шестое отличалось приставкой.
  - orgId: 1
    uid: product-cs2-parse-slow

  # Удалены при пересборке тревог 29.09.2026:
  # дубль «Сервер: хост задыхается без памяти»: MemAvailable на хосте с ARC ZFS ниже 15% — норма, 174 перехода в Pending за две недели и ни одной настоящей аварии, которую не поймал бы PSI
  - orgId: 1
    uid: infra-memory-low
  # занятый swap сам по себе не авария; активный обмен ловит «хост гоняет swap туда-обратно»
  - orgId: 1
    uid: hw-swap-in-use
  # метрики cs2_erasure_pending_overdue нет с 087_no_hide_no_erase: правило не могло сработать
  - orgId: 1
    uid: cs2-erasure-overdue

  - orgId: 1
    uid: cs2-render-machine-space-low

groups:
  - orgId: 1
    name: infra-host
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-disk-space-low
        title: 'Сервер: на системном диске мало места'
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: node_filesystem_avail_bytes{mountpoint="/",job=~"node|node-host"} / node_filesystem_size_bytes{mountpoint="/",job=~"node|node-host"} < 0.10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - -1000000000
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
          area: server
        annotations:
          summary: 'Сервер: на системном диске мало места'
          description: 'На корневом диске цели {{ $labels.job }} осталось менее 10%. Для web действует собственная квота ZFS: свободное место общего пула её не отменяет. Проверить крупные
            версии контента и снимки перед удалением; не делать blanket prune.'
          value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}'
          threshold: меньше 10%, держится 15 мин
          runbook_url: https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-disk-space-low
          __dashboardUid__: samoylove-reliability
          __panelId__: '31'

      - uid: infra-cpu-saturated
        title: "Сервер: процессор хоста занят полностью"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Только хост: node_exporter внутри web читает /proc хоста, и без фильтра
              # одна и та же загрузка приходила двумя тревогами.
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-host",mode="idle"}[5m])) * 100) > 90
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning, area: server }
        annotations: { summary: "Процессор хоста занят больше чем на 90% полчаса подряд", description: "Все контейнеры делят одни ядра: при полной загрузке тормозят сайты и растут очереди CI и рендера. Смотреть «Процессор по инстансам» — кто съел; обычно это CI-сборки или рендер.", value: '{{ if $values.A }}{{ printf "%.0f" $values.A.Value }}%{{ else }}нет данных{{ end }}', threshold: "больше 90%, держится 30 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-cpu-saturated", __dashboardUid__: "samoylove-hardware", __panelId__: "15" }

      - uid: infra-node-rebooted
        title: "Сервер: хост перезагрузился"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # for отсутствует не по забывчивости: сама метрика гасит себя —
              # условие ложно уже через 5 минут после старта, держать
              # отдельную задержку незачем.
              # Только хост: время загрузки у web то же самое (общее ядро), и
              # перезагрузка приходила двумя одинаковыми тревогами.
              expr: time() - node_boot_time_seconds{job="node-host"} < 300
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: info, area: server }
        annotations: { summary: "Хост перезагрузился меньше пяти минут назад", description: "Для сведения: если перезагрузку не делали руками — смотреть journalctl -b -1 на хосте (паника, питание, сторожевой таймер). После перезагрузки проверить, что поднялись все инстансы с автозапуском.", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-node-rebooted", __dashboardUid__: "samoylove-hardware", __panelId__: "62" }

      - uid: infra-network-errors-high
        title: "Сервер: сетевой интерфейс теряет пакеты с ошибками"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
                  +
                rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
                  > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: server }
        annotations: { summary: "Интерфейс {{ $labels.device }} получает или отправляет пакеты с ошибками", description: "Ошибки на физическом интерфейсе — кабель, порт роутера или драйвер. Сайты в это время могут открываться рывками. Смотреть «Ошибки и обрывы линка» и ethtool -S на хосте.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 0, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-network-errors-high", __dashboardUid__: "samoylove-hardware", __panelId__: "53" }

  # Железо и инфраструктура хоста. Появилось вместе со вторым node_exporter,
  # который стоит на самом хосте: стек метрик живёт в контейнере web и до
  # датчиков не достаёт. Пороги взяты из фактических замеров и из CLAUDE.md,
  # а не из общих соображений:
  #
  #   * 92 °C у CPU — под полной нагрузкой на 16 потоков сервер устойчиво
  #     держит 88–89 °C без троттлинга, так что 92 — это уже отклонение,
  #     а не штатная работа (предел кристалла 95 °C);
  #   * 65 °C у памяти — ровно та граница, за которой в CLAUDE.md предписано
  #     ослабить tRFC с 600 до 700–800: значение тюнерское, и отказ из-за него
  #     наступает именно при росте температуры;
  #   * ошибки ZFS вынесены в critical, потому что ECC на 8700G нет и ошибки
  #     памяти здесь молчаливые — контрольные суммы пула остаются единственным
  #     способом заметить порчу данных.
  - orgId: 1
    name: infra-hardware
    folder: Alerts
    interval: 1m
    rules:
      - uid: hw-cpu-temp-high
        title: "Сервер: процессор перегрет"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # 95 °C у 8700G — штатный предел (Tjmax): под нагрузкой процессор держит
              # его сам, сбрасывая частоту, и прежний порог 92 горел на каждом
              # тяжёлом прогоне CI. За неделю до 22.09.2026 при 94 °C и выше
              # средняя частота ни разу не падала ниже 4,49 ГГц (медиана 4,72) —
              # выше базовых 4,2. Беда начинается, когда предела не хватает:
              # пятнадцать минут у предела И частота ниже базовой (охлаждение
              # не справляется и отнимает производительность), либо выше 97 °C
              # (защита не удерживает предел).
              expr: '(min_over_time((node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="k10temp"})[15m:1m]) >= 94 and on() avg(avg_over_time(node_cpu_scaling_frequency_hertz{job="node-host"}[15m])) < 4.2e9) or max_over_time((node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="k10temp"})[5m:1m]) > 97'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical, area: server }
        annotations: { summary: "Процессор держит 94 °C и сбрасывает частоту ниже базовой, или выше 97 °C", description: "Процессор 15 минут у предела 95 °C и при этом ниже базовой частоты 4,2 ГГц — охлаждение не справляется и отнимает производительность; или температура выше 97 °C — защита не удерживает предел. Штатный упор в 95 °C при нагрузке на полной частоте тревогой не считается. Проверить обороты кулера и пыль, график частоты — «Железо».", value: '{{ if $values.A }}{{ printf "%.0f" $values.A.Value }} °C{{ else }}нет данных{{ end }}', threshold: "больше 97 °C, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-cpu-temp-high", __dashboardUid__: "samoylove-hardware", __panelId__: "9" }

      - uid: hw-dimm-temp-high
        title: "Сервер: модуль памяти перегрет"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="spd5118"} > 65
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: server }
        annotations: { summary: "Модуль DDR5 горячее 65 °C", description: "На этой машине нет ECC: перегретая память — это тихие ошибки данных. Ослабить tRFC с 600 до 700–800 в BIOS или улучшить обдув.", value: '{{ if $values.A }}{{ printf "%.0f" $values.A.Value }} °C{{ else }}нет данных{{ end }}', threshold: "больше 65 °C, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-dimm-temp-high", __dashboardUid__: "samoylove-hardware", __panelId__: "10" }

      - uid: hw-nvme-temp-high
        title: "Сервер: NVMe перегрет"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius{sensor="temp1"} * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="nvme"} > 70
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, area: server }
        annotations: { summary: "NVMe горячее 70 °C: контроллер начинает сбрасывать скорость", description: "Диск троттлит — медленнее запись демок, клипов и баз. Обычно следствие долгой записи (рендер, CI) без обдува.", value: '{{ if $values.A }}{{ printf "%.0f" $values.A.Value }} °C{{ else }}нет данных{{ end }}', threshold: "больше 70 °C, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-nvme-temp-high", __dashboardUid__: "samoylove-hardware", __panelId__: "10" }

      - uid: hw-cpu-fan-stopped
        title: "Сервер: кулер процессора стоит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_fan_rpm{sensor="fan2"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: server }
        annotations: { summary: "Кулер процессора показывает 0 об/мин", description: "Без кулера процессор перегреется за минуты и хост выключится. Проверить разъём и сам вентилятор; если датчик пропал после перезагрузки — модуль nct6775 не загрузился.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-cpu-fan-stopped", __dashboardUid__: "samoylove-hardware", __panelId__: "12" }

      - uid: hw-zpool-unhealthy
        title: "Сервер: пул ZFS не в порядке"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: zpool_health_state != 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
