  - orgId: 1
    name: infra-sites
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-site-down
        title: "Сайты: сайт не открывается"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(probe_success == 0) unless on(instance) label_replace((deploy_maintenance_until_seconds{site!=\"\"} > time()), \"instance\", \"$1\", \"site\", \"(.+)\")"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: sites }
        annotations: { summary: "{{ $labels.instance }} не отвечает на внешнюю пробу", description: "Людям сайт недоступен. Если лежат все сайты разом — nginx, сеть или DNS; если один — его служба.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-site-down", __dashboardUid__: "samoylove-overview", __panelId__: "28" }

      - uid: infra-certificate-expiring-soon
        title: "Сайты: сертификат истекает"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning, area: sites }
        annotations: { summary: "Сертификат {{ $labels.instance }} истекает меньше чем через 14 дней", description: "certbot не продлил сертификат. sudo certbot renew --dry-run в web.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "меньше 14, держится 1 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-certificate-expiring-soon", __dashboardUid__: "samoylove-overview", __panelId__: "29" }

      - uid: infra-probe-latency-high
        title: "Сайты: сайт отвечает медленно"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(probe_duration_seconds > 3 and on(instance) probe_success == 1) unless on(instance) label_replace((deploy_maintenance_until_seconds{site!=\"\"} > time()), \"instance\", \"$1\", \"site\", \"(.+)\")"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: sites }
        annotations: { summary: "{{ $labels.instance }} отвечает на внешнюю пробу дольше 3 секунд", description: "Сайт открывается, но медленно. Лежащий сайт сюда не попадает: для него есть «Сайты: сайт не открывается».", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-probe-latency-high", __dashboardUid__: "samoylove-overview", __panelId__: "30" }

      - uid: infra-status-check-down
        title: "Сайты: проверка статус-страницы красная"
        condition: C
        data:
          - refId: A
            # SiteDown видит только корень шести доменов. Агент статус-страницы
            # держит 14 более узких проверок — API манифестов лаунчера, путь
            # обновления, service worker метро, мини-приложение бота — и они
            # видны только на дашборде: провалившийся launcher-api при живом
            # launcher.samoy.love раньше не будил никого.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(status_check_up == 0) unless on(check) (deploy_maintenance_check_until_seconds > time())"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: sites }
        annotations: { summary: "{{ $labels.project }} / {{ $labels.name }}: проверка не проходит", description: "Это то же, что видят люди на status.samoy.love. Подробности — на дашборде «Статус».", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#infra-status-check-down", __dashboardUid__: "samoylove-status", __panelId__: "12" }

  - orgId: 1
    name: product-sites
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-site-error-rate-high
        title: "Сайты: больше 5% ответов — пятисотки"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(sum by (host) (rate(samoylove_site_http_response_count_total{status=~\"5..\"}[15m]))\n  /\nsum by (host) (rate(samoylove_site_http_response_count_total[15m])) > 0.05\nand\nsum by (host) (increase(samoylove_site_http_response_count_total[15m])) > 20) and (sum by(host) (increase(samoylove_site_http_response_count_total{status=~\"5..\"}[5m])) > 0)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical, area: sites }
        annotations: { summary: "{{ $labels.host }}: больше 5% ответов с кодом 5xx", description: "Страницы у людей не открываются. Какой раздел — «Запросы по разделам» на дашборде сайта; у cs.samoy.love — «Ошибки по разделам» Пристрелки.", value: '{{ if $values.A }}{{ humanizePercentage $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "больше 2000%, держится 10 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-site-error-rate-high", __dashboardUid__: "samoylove-overview", __panelId__: "10" }

      - uid: product-traffic-collapse
        title: "Сайты: посещаемость упала впятеро"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h]))
                  <
                0.2 * sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w))
                and
                sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w)) > 50
                and on() (vector(time()) > 1790640000)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2h
        labels: { severity: warning, area: sites }
        annotations: { summary: "{{ $labels.host }}: заходов на главную впятеро меньше, чем неделю назад", description: "Сравнение идёт с тем же окном неделю назад. С 20.09.2026 журнал посещаемости не считает наши собственные проверки — проба blackbox и агент статус-страницы давали у тихих сайтов почти весь трафик главной. Неделю после этой правки сравнивать не с чем: прошлая неделя ещё с пробами, и любое окно выглядит падением в тридцать раз. Отсюда условие на время в выражении: правило молчит до 29.09.2026, когда в сравнение попадёт неделя чистых данных. После этой даты условие убрать.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "держится 2 ч", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-traffic-collapse", __dashboardUid__: "samoylove-overview", __panelId__: "32" }

      - uid: product-site-latency-high
        title: "Сайты: nginx отвечает медленно"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ИСКЛЮЧЕНЫ ОБА ПУТИ, ПО КОТОРЫМ ОТДАЮТСЯ ФАЙЛЫ. Скачивание — это
              # передача, а не обработка запроса: request_time растёт вместе с
              # размером файла и медленным каналом клиента, а не с нагрузкой на
              # сервер. Пара таких запросов в окне целиком определяет p95 и
              # будит алерт без всякой деградации сайта.
              #
              # /downloads/ — установщик лаунчера, был исключён сразу.
              # /content/ — раздача самих игр, добавлено 04.09.2026. Исключили
              # редкое, а шумело частое: за шесть часов /downloads/ дал 10
              # запросов с p95 = 0.00 с, а /content/ — 2412 запросов с
              # p95 = 5.00 с. Из-за этого SiteLatencyHigh за один день
              # сработал трижды, и с учётом сообщений о восстановлении и
              # картинок это двенадцать сообщений в чат — ни об одной
              # настоящей проблеме.
              # /clips/video/ и /admin/vnc/ — Пристрелка, добавлено 18.09.2026.
              # Те же грабли: видео клипов качается минутами, а websockify
              # экрана рендера держит соединение весь сеанс. 15.09 это дало
              # три ложных SiteLatencyHigh у cs.samoy.love за вечер.
              expr: "histogram_quantile(0.95, sum by (le, host) (rate(samoylove_site_http_response_time_seconds_hist_bucket{host!=\"cs.samoy.love\",path!~\"/downloads/|/content/|/clips/video/|/admin/vnc/\"}[15m]))) > 1"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, area: sites }
        annotations: { summary: "{{ $labels.host }}: 95-й перцентиль ответа nginx дольше секунды", description: "Страницы открываются медленно. У cs.samoy.love своя, точнее, тревога по разделам сайта — здесь его нет: отдача роликов и звука делала ему p95 секундами (38 ложных срабатываний за две недели сентября).", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 1 с, держится 15 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#product-site-latency-high", __dashboardUid__: "samoylove-overview", __panelId__: "33" }

      - uid: product-access-log-parse-failing
