            model:
              expr: "((windows_memory_committed_bytes{job=\"cs2-win\"} / windows_memory_physical_total_bytes{job=\"cs2-win\"}) > 1) and on(instance) (rate(windows_memory_swap_page_operations_total{job=\"cs2-win\"}[30m]) > 1000) and on(instance) (windows_memory_available_bytes{job=\"cs2-win\"} / windows_memory_physical_total_bytes{job=\"cs2-win\"} < 0.10)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
