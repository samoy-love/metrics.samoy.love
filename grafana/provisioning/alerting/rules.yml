# Правила алертинга: инфраструктура и продуктовые метрики. Раньше это были
# prometheus/rules/infra.yml и product.yml, уходившие в отдельный Alertmanager
# (см. историю docker-compose.yml) — теперь Grafana сама и вычисляет правила,
# и шлёт в Telegram через grafana/provisioning/alerting/contactpoints.yml.
# Имена правил и текст summary — на английском, как и раньше: это то, что
# видно в UI, в API и в сообщении бота.
#
# ПОЧЕМУ У КАЖДОГО ПРАВИЛА УСЛОВИЕ "gt -1e9", А НЕ ПОРОГ ИЗ SUMMARY. Исходные
# PromQL-выражения — это фильтры Prometheus (`x < 0.10`, `x == 0`, `x == 1`):
# они возвращают ряд, только когда условие уже верно, а его ЗНАЧЕНИЕ при этом
# может быть чем угодно — долей от 0 до 1, точным нулём (`== 0`), единицей
# (`== 1`) или отрицательным числом (просроченный сертификат). Grafana же
# требует отдельный узел-условие, который сравнивает ЗНАЧЕНИЕ. Порог в
# -1 000 000 000 ниже любого реального значения во всех выражениях ниже, так
# что условие эквивалентно исходному «ряд есть — значит, авария»: считать
# срабатыванием сам факт, что фильтр Prometheus что-то вернул, а не то, что
# вернувшееся число больше нуля (иначе `== 0` никогда бы не сработало).
#
# ЧЕГО ЗДЕСЬ НЕТ. AlertmanagerDown и AlertNotificationsFailing (были в
# infra-alerting) не перенесены: обе проверяли отдельный Alertmanager, а его
# в стеке больше нет — Grafana теперь и вычисляет правила, и доставляет
# сообщения сама, так что проверять «жив ли Alertmanager» больше нечего.
# Самой Grafana, если она недоступна, тоже некому будет об этом сообщить —
# та же дыра, что была описана в исходном комментарии infra-alerting, и её
# закрывает внешняя проверка GitHub Actions (.github/workflows/ci.yml), а не
# правило внутри самого стека.
#
# inhibit_rules из alertmanager.yml (SiteDown гасит ProbeLatencyHigh по тому
# же instance, critical гасит warning по тому же alertname+instance) тоже не
# перенесены: у Grafana Alerting нет прямого аналога подавления одного
# алерта другим на уровне политики маршрутизации. Из трёх алертов про один
# упавший сайт (SiteDown, ProbeLatencyHigh, возможно SiteErrorRateHigh) в чат
# теперь придёт больше одного сообщения.

apiVersion: 1

groups:
  - orgId: 1
    name: infra-host
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-disk-space-low
        title: DiskSpaceLow
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Less than 10% free space left on /", __dashboardUid__: "samoylove-overview", __panelId__: "18" }

      - uid: infra-memory-low
        title: MemoryLow
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Less than 10% of memory available", __dashboardUid__: "samoylove-overview", __panelId__: "17" }

      - uid: infra-cpu-saturated
        title: CpuSaturated
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "CPU above 90% for half an hour", __dashboardUid__: "samoylove-overview", __panelId__: "16" }

      - uid: infra-node-rebooted
        title: NodeRebooted
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # for отсутствует не по забывчивости: сама метрика гасит себя —
              # условие ложно уже через 5 минут после старта, держать
              # отдельную задержку незачем.
              expr: time() - node_boot_time_seconds < 300
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning }
        annotations: { summary: "Server rebooted less than 5 minutes ago", __dashboardUid__: "samoylove-overview", __panelId__: "19" }

      - uid: infra-network-errors-high
        title: NetworkErrorsHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
                  +
                rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
                  > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Network interface {{ $labels.device }} is dropping packets with errors", __dashboardUid__: "samoylove-overview", __panelId__: "36" }

  # Железо и инфраструктура хоста. Появилось вместе со вторым node_exporter,
  # который стоит на самом хосте: стек метрик живёт в контейнере web и до
  # датчиков не достаёт. Пороги взяты из фактических замеров и из CLAUDE.md,
  # а не из общих соображений:
  #
  #   * 92 °C у CPU — под полной нагрузкой на 16 потоков сервер устойчиво
  #     держит 88–89 °C без троттлинга, так что 92 — это уже отклонение,
  #     а не штатная работа (предел кристалла 95 °C);
  #   * 65 °C у памяти — ровно та граница, за которой в CLAUDE.md предписано
  #     ослабить tRFC с 600 до 700–800: значение тюнерское, и отказ из-за него
  #     наступает именно при росте температуры;
  #   * ошибки ZFS вынесены в critical, потому что ECC на 8700G нет и ошибки
  #     памяти здесь молчаливые — контрольные суммы пула остаются единственным
  #     способом заметить порчу данных.
  - orgId: 1
    name: infra-hardware
    folder: Alerts
    interval: 1m
    rules:
      - uid: hw-cpu-temp-high
        title: CPUTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="k10temp"} > 92
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "CPU above 92C for 10 minutes (throttling limit is 95C)" }

      - uid: hw-dimm-temp-high
        title: MemoryTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="spd5118"} > 65
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "DDR5 module above 65C: loosen tRFC from 600 to 700-800" }

      - uid: hw-nvme-temp-high
        title: NVMeTemperatureHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="nvme"} > 70
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "NVMe above 70C, controller starts throttling" }

      - uid: hw-cpu-fan-stopped
        title: CPUFanStopped
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_hwmon_fan_rpm{sensor="fan2"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "CPU cooler fan reports 0 RPM" }

      - uid: hw-zpool-unhealthy
        title: ZpoolNotHealthy
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: zpool_health_state != 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "ZFS pool is not ONLINE: mirror degraded" }

      - uid: hw-zpool-errors
        title: ZpoolErrors
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: zpool_device_errors_total > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "ZFS reports device errors: no ECC on this box, checksums are the only corruption signal" }

      - uid: hw-nvme-media-errors
        title: NVMeMediaErrors
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: smart_nvme_media_errors_total > 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "SMART reports unrecoverable media errors, plan disk replacement" }

      - uid: hw-nvme-wear-high
        title: NVMeWearHigh
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: smart_nvme_percentage_used_ratio > 0.8
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "NVMe wear above 80% of rated endurance" }

      - uid: hw-host-unit-down
        title: HostUnitInactive
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_systemd_unit_state{instance="srv-host",state="active",name=~"(incus|web-isolation|ci-isolation|win-isolation|wan-shaper|fail2ban)\\.service"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "Host infrastructure unit is not active (isolation, shaper or incus)" }

      - uid: hw-hw-metrics-missing
        title: HardwareMetricsMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up{job="node-host"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Host node_exporter is unreachable: hardware metrics stopped" }

      - uid: hw-incus-metrics-missing
        title: IncusMetricsMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up{job="incus"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Incus metrics endpoint is unreachable: per-instance metrics stopped" }

      - uid: hw-smart-collect-failing
        title: SmartCollectFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: smart_collect_ok == 0 or zpool_collect_ok == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "SMART/ZFS textfile collector is failing, disk health is unknown" }

  - orgId: 1
    name: infra-services
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-service-down
        title: ServiceDown
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_systemd_unit_state{name=~"(snakes|chillhub-api|chillhub-admin|nginx|docker)\\.service",state="active"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Unit {{ $labels.name }} is not active", __dashboardUid__: "samoylove-overview", __panelId__: "25" }

      - uid: infra-unit-failed
        title: UnitFailed
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: node_systemd_unit_state{state="failed"} == 1
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Unit {{ $labels.name }} is in failed state", __dashboardUid__: "samoylove-overview", __panelId__: "25" }

      - uid: infra-monitoring-exporter-down
        title: MonitoringExporterDown
        condition: C
        data:
          - refId: A
            # ServiceDown/UnitFailed смотрят на systemd-юниты хоста, а не на
            # контейнеры самого стека мониторинга — упавший blackbox-exporter
            # или nginxlog-exporter не задел бы ни один systemd-юнит и остался
            # бы незамеченным: SiteDown и посещаемость просто замрут на
            # последнем значении молча, без единого алерта.
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up{job=~"blackbox-http|nginxlog"} == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Prometheus cannot scrape {{ $labels.job }} — data behind it is stale", __dashboardUid__: "samoylove-overview", __panelId__: "26" }

  - orgId: 1
    name: infra-deploy-events
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-deploy-event-delivery-stuck
        title: DeployEventDeliveryStuck
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: statusbot_deploy_events_pending_age_seconds > 300
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: { severity: critical, source: textfile }
        annotations: { summary: "Deploy event waiting in the queue for over 5 minutes — release messages are not delivered", __dashboardUid__: "samoylove-status", __panelId__: "35" }

      - uid: infra-deploy-event-metrics-missing
        title: DeployEventMetricsMissing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: absent(statusbot_deploy_events_pending_age_seconds)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, source: textfile }
        annotations: { summary: "Bot metrics carry no deploy event counters — the event path is unobservable", __dashboardUid__: "samoylove-status", __panelId__: "35" }

  - orgId: 1
    name: infra-sites
    folder: Alerts
    interval: 1m
    rules:
      - uid: infra-site-down
        title: SiteDown
