                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, area: cs2 }
        annotations: { summary: "Steam ждёт поставить обновление CS2 на машине рендера (машина — метка engine)", description: "Пока оно не встало, новые демки не читаются старой игрой, а новая HLAE, собранная под новую игру, её не поднимает. На cs2-win: мягко остановить работника (C:\\cs2\\stop-render.ps1), запустить CS2 через Steam разовой задачей в сеансе render (steam://run/730), дождаться, когда buildid в appmanifest_730.acf сравняется с TargetBuildID, погасить игру и запустить задачу cs2-render — проба при старте проверит движок. Если HLAE под новую игру ещё нет, проба упадёт, и заказы уйдут на Linux. На Linux — смотреть клиент Steam в cs2-render. Карточка машины в админке cs2 пишет, какая сборка ждёт.", value: '{{ if $values.A }}{{ humanizeDuration $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "дольше 3 ч, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-game-update-stuck", __dashboardUid__: "samoylove-cs2", __panelId__: "911" }

