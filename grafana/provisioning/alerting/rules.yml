      - uid: cs2-demo-storage-low
        title: "CS2: место под демки кончается"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ПОРОГ ВЫБРАН НЕ КРУГЛЫМ ЧИСЛОМ, А ПОВЕДЕНИЕМ СЛУЖБЫ: скачиватель
              # не начинает круг, если свободно меньше десяти гигабайт (иначе он
              # забивает диск за сутки — тихо и сразу у всех, включая разбор с
              # его временными файлами). Пятнадцать — это «осталось несколько
              # демок до остановки», то есть время что-то сделать.
              expr: '(cs2_demo_storage_total_bytes - cs2_demo_storage_used_bytes) / 1024^3 < 15'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Под демки осталось меньше 15 ГБ: скачиватель встанет на десяти", description: "Демки хранятся целиком и без срока — это решение, а не недосмотр, и защита пула здесь квота, а не удаление. Ниже десяти гигабайт скачиватель перестаёт начинать круги: матчи продолжат находиться, но файлы за ними приходить перестанут, а окно Valve — тридцать дней. Решать владельцу: расширить квоту ZFS или разобраться, что занимает место.", __dashboardUid__: "samoylove-cs2", __panelId__: "402" }
      - uid: cs2-demo-storage-forecast
        title: "CS2: места под демки хватит меньше чем на две недели"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 21600, to: 0 }
            model:
              # Предсказание по шести часам роста на две недели вперёд. Это
              # ПРЕДУПРЕЖДЕНИЕ, А НЕ ФАКТ: один вечер с активной игрой задирает
              # наклон, поэтому правило горит только через час и рядом с ним
              # всегда стоит настоящий остаток из соседнего правила.
              expr: 'predict_linear(cs2_demo_storage_used_bytes[6h], 14*24*3600) > cs2_demo_storage_total_bytes - 10 * 1024^3'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: info }
        annotations: { summary: "При нынешнем темпе места под демки хватит меньше чем на две недели", description: "Наклон взят по последним шести часам и продолжен на две недели — это повод посмотреть, а не тревога: вечер активной игры задирает темп, а неделя без игры его обнуляет. Настоящий остаток — в правиле «место под демки кончается».", __dashboardUid__: "samoylove-cs2", __panelId__: "402" }
      - uid: cs2-worker-silent
        title: "CS2: работник цепочки молчит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # ВЫКЛЮЧЕННЫЕ ОТСЕИВАЮТСЯ, А НЕ ВКЛЮЧЁННЫЕ ОТБИРАЮТСЯ. Метрика
              # cs2_worker_enabled есть только у работников с рубильником, и
              # отбор по ней выбрасывал «разбор» — того единственного, чьё
              # молчание и значит, что матчи не разбираются.
              expr: |
                (time() - cs2_worker_last_success_timestamp_seconds > 21600)
                and on(worker) cs2_worker_backlog > 0
                unless on(worker) cs2_worker_enabled == 0
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Работник {{ $labels.worker }} шесть часов не сделал ни одного дела, хотя его ждут дела", description: "Работник запущен, очередь у него непустая (cs2_worker_backlog), а следов работы в базе шесть часов нет: круг падает молча. Для игрока это затор в цепочке без единой ошибки в журнале. Тишина при пустой очереди — норма (никто не играл) и тревогой не считается: до 11.09.2026 правило этого не различало и горело весь вечер.", __dashboardUid__: "samoylove-cs2", __panelId__: "401" }
      - uid: cs2-queue-stuck
        title: "CS2: разбор матчей встал"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # Правая часть СВЁРНУТА ПО instance. У cs2_parse_total есть метка
              # result (ok/failed), у глубины очереди её нет, а `and` сличает
              # полный набор меток: совпадений не было НИ РАЗУ, и правило не
              # могло сработать с самого начала.
              expr: 'min_over_time(cs2_parse_queue_depth[15m]) > 0 and on(instance) sum by (instance) (rate(cs2_parse_total[15m])) == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Очередь разбора не убывает, а разборов не происходит вовсе", description: "Демки лежат, разбора нет ни у кого: у игрока страница матча вечно показывает «разбирается». Обычная причина — обновление игры сломало парсер; вторая — воркеры не поднялись после выкатки. Отказ выглядит как тишина, а не как ошибка.", __dashboardUid__: "samoylove-cs2", __panelId__: "300" }
      - uid: cs2-parse-failures
        title: "CS2: разбор падает у каждого пятого матча"
