              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, source: textfile }
        annotations: { summary: "Status page agent has not polled services for over 10 minutes", __dashboardUid__: "samoylove-status", __panelId__: "8" }

      - uid: product-status-bot-stale
        title: StatusBotStale
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: time() - statusbot_heartbeat_timestamp_seconds > 600
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        # critical, а не warning: молчащий heartbeat означает мёртвый бот
        # целиком — ни одно сообщение никуда не уйдёт. TelegramDeliveryFailing
        # рядом (бот жив, но не достучался до Telegram) остаётся critical по
        # той же причине — разводить их по severity было бы непоследовательно.
        labels: { severity: critical, source: textfile }
        annotations: { summary: "Telegram bot has not updated its metrics for over 10 minutes", __dashboardUid__: "samoylove-status", __panelId__: "17" }

      - uid: product-telegram-delivery-failing
        title: TelegramDeliveryFailing
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: increase(statusbot_send_failures_total[1h]) > 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Bot cannot send messages: incident notifications will not arrive", __dashboardUid__: "samoylove-status", __panelId__: "18" }

  - orgId: 1
    name: product-snakes
    folder: Alerts
    interval: 1m
    rules:
      - uid: product-snakes-profiles-read-only
        title: SnakesProfilesReadOnly
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
