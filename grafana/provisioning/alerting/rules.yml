      # Инстанс с boot.autostart=true не RUNNING. Встроенный экспортёр Incus
      # (job incus) отдаёт ряды только работающих инстансов: не поднявшийся
      # после перезагрузки хоста games или speedtest в нём просто пропадает, и
      # пропажу ряда не отличить от того, что инстанса нет. Поэтому данные —
      # сборщик incus-units-collect на хосте (репозиторий home-server), textfile
      # node-host, раз в минуту `incus list`. Раннеры CI стоят с autostart=false
      # намеренно — их поднимает ci-autoscaler, — и сюда не попадают.
      # Устаревание самого файла ловит «CS2: не видно служб контейнера»: у него
      # та же метка времени.
      - uid: hw-incus-autostart-not-running
        title: "Сервер: инстанс с автозапуском лежит"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: '(incus_instance_running{autostart="true"} == 0) or (incus_instance_list_ok == 0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [-1000000000] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, area: server }
        annotations: { summary: "Инстанс {{ $labels.name }} должен работать, но не RUNNING", description: "Всё, что живёт в этом инстансе, недоступно целиком (cs2 — сайт Пристрелки, web — все сайты, cs2-render — рендер). incus info и incus start на хосте, затем журнал инстанса.", threshold: "держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#hw-incus-autostart-not-running", __dashboardUid__: "samoylove-hardware", __panelId__: "82" }

