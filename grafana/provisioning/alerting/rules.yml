        annotations: { summary: "В cs2-render за час убито по памяти три и больше процессов", description: "Игру или ffmpeg рендера убивает OOM-killer: задания повторяются по кругу, клипы опаздывают. Одиночное убийство при тяжёлой демке — не повод будить. Смотреть память cs2-render и не идёт ли рядом стенд или повтор.", value: '{{ if $values.A }}{{ humanize $values.A.Value }}{{ else }}нет данных{{ end }}', threshold: "не меньше 3, держится 5 мин", runbook_url: "https://github.com/samoy-love/metrics.samoy.love/blob/main/docs/runbook.md#cs2-render-oom", __dashboardUid__: "samoylove-cs2", __panelId__: "1709" }

      - uid: cs2-telegram-rejected
        title: "Пристрелка: Telegram не принимает сообщения бота"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
