      - uid: product-probe-disagrees-with-agent
        title: "Сайты: проба и агент статуса расходятся"
        condition: C
        data:
          - refId: A
            datasourceUid: samoylove-prometheus
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              expr: '(probe_success{instance="https://samoy.love/"} == 0 and on() max(status_check_up{check="samoylove"}) == 1) or (probe_success{instance="https://metro.samoy.love/"} == 0 and on() max(status_check_up{check="metro"}) == 1) or (probe_success{instance="https://launcher.samoy.love/"} == 0 and on() max(status_check_up{check="launcher"}) == 1) or (probe_success{instance="https://snakes.samoy.love/"} == 0 and on() max(status_check_up{check="snakes"}) == 1) or (probe_success{instance="https://status.samoy.love/"} == 0 and on() max(status_check_up{check="status-page"}) == 1) or (probe_success{instance="https://die.samoy.love/"} == 0 and on() max(status_check_up{check="die"}) == 1) or (probe_success{instance="https://cs.samoy.love/"} == 0 and on() max(status_check_up{check="cs2-health"}) == 1)'
              instant: true
              refId: A
          - refId: C
