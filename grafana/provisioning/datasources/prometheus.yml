# Источник данных. Заводится автоматически при старте Grafana, руками
# в интерфейсе ничего добавлять не нужно.

apiVersion: 1

# Провижининг ищет источник по uid, а не по имени. Если uid в этом файле
# сменился, а в базе Grafana лежит запись со старым, старт падает с
# «Datasource provisioning error: data source not found» — и падает в цикле,
# потому что база переживает пересоздание контейнера. Явное удаление по имени
# отрабатывает до создания и снимает эту зависимость от истории базы.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: samoylove-prometheus
    type: prometheus
    access: proxy
    # Внутри compose-сети, а не через nginx: ходить наружу и обратно ради
    # соседнего контейнера значит завязать панель на живость basic-auth.
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST
