# Пробы доступности сайтов.

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      # Редирект на https уже учтён в списке целей (все адреса — https),
      # но переходы вида /  ->  /index.html оставляем разрешёнными.
      follow_redirects: true
      # Только IPv4: AAAA у доменов есть, но исходящий IPv6 с этого сервера
      # не настроен, и проба по нему падала бы, а сайт при этом жив.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_ssl: false
      fail_if_not_ssl: true
      # Проба обязана быть узнаваемой по User-Agent: nginx на хосте не пишет
      # запросы с префиксом samoylove- в журнал посещаемости
      # (deploy-kit/nginx/conf.d/samoylove-log-metrics.conf, map
      # $samoylove_metrics_loggable). Без этого две пробы в минуту на каждый
      # сайт складываются в «посещаемость» главной страницы, а у тихих сайтов
      # составляют её целиком: дашборды вычитали пробы формулой, а тревога о
      # падении трафика считала по загрязнённому ряду и падения не видела.
      #
      # Имя пишется своё, а не штатное Blackbox-Exporter/<версия>: правило в
      # nginx одно на все наши ходилки — «начинается на samoylove-», — и
      # обновление образа его не ломает. Штатное имя в том же map оставлено
      # запасным вариантом.
      headers:
        User-Agent: "samoylove-blackbox (+https://metrics.samoy.love)"
