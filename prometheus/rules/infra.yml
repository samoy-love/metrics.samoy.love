# Правила оповещений: инфраструктура.
#
# Alertmanager не разворачивается: уведомлять некуда и некого, владелец
# смотрит панель. Правила здесь нужны как явный список того, что считается
# аварией — их состояние видно в /prometheus/alerts.
#
# Имена правил и текст summary — на английском: это то, что видно в UI и в
# API, и на них смотрят не только отсюда. Объяснения «почему именно так»
# остаются в комментариях.

groups:
  - name: infra-host
    rules:
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% free space left on /"

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of memory available"

      - alert: CpuSaturated
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% for half an hour"

  - name: infra-services
    rules:
      # status-agent и *-backup — oneshot по таймеру, для них «не active» это
      # норма, поэтому в правило берутся только постоянно работающие юниты.
      - alert: ServiceDown
        expr: node_systemd_unit_state{name=~"(snakes|chillhub-api|chillhub-admin|nginx|docker)\\.service",state="active"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Unit {{ $labels.name }} is not active"

      # Обратная сторона правила выше: раз с oneshot-юнитов не спрашивают
      # active, то без этого правила их падение не видно ВООБЩЕ. Так и вышло —
      # chillhub-backup падал четыре ночи подряд молча, оставляя каждый раз по
      # неполному снимку, и заметили это только когда на диске кончилось место.
      # failed держится до следующего удачного запуска или reset-failed, так
      # что достаточно посмотреть на панель хотя бы раз в сутки.
      - alert: UnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Unit {{ $labels.name }} is in failed state"

  - name: infra-sites
    rules:
      - alert: SiteDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not responding"

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in less than 14 days"

      # Внешняя проба целиком: DNS, TLS, ответ. Не путать с SiteLatencyHigh из
      # product.yml — там p95 по журналу nginx, то есть время самого сервера.
      - alert: ProbeLatencyHigh
        expr: probe_duration_seconds > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} probe takes longer than 3 seconds"
