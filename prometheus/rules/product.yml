# Правила по продуктовым метрикам: не «сервис жив», а «им пользуются и это
# работает». Alertmanager по-прежнему не разворачивается — состояние правил
# видно в /prometheus/alerts, и это осознанный выбор: уведомлять некого,
# владелец смотрит панель.
#
# Общее для всех правил ниже: у каждого есть защита от малых чисел. Доля
# ошибок на выборке из трёх запросов скачет от 0 до 33% сама по себе, и алерт,
# который срабатывает от одного визита робота, отключают через неделю.
#
# Группы здесь product-*, в infra.yml — infra-*. Уникальности имени группы
# Prometheus требует только внутри файла, но две одноимённые группы в
# /prometheus/alerts различались бы лишь путём к файлу, и это ровно тот
# случай, когда экономия на префиксе стоит десяти минут в аварию.

groups:
  - name: product-sites
    rules:
      - alert: SiteErrorRateHigh
        # 5xx — это всегда мы. 4xx намеренно НЕ считаем: на статике их делает
        # кто угодно, перебирая /wp-login.php, и порог по ним ловил бы
        # сканеров, а не поломку.
        expr: |
          sum by (host) (rate(samoylove_site_http_response_count_total{status=~"5.."}[15m]))
            /
          sum by (host) (rate(samoylove_site_http_response_count_total[15m])) > 0.05
          and
          sum by (host) (increase(samoylove_site_http_response_count_total[15m])) > 20
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }}: more than 5% of responses are 5xx"

      - alert: TrafficCollapse
        # Сравнение с тем же часом неделю назад, а не с абсолютным порогом:
        # у личного сайта нет «нормального» числа визитов, зато есть недельный
        # ритм. Нижняя граница на базу нужна, чтобы правило молчало на сайте,
        # куда и неделю назад никто не заходил.
        expr: |
          sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h]))
            <
          0.2 * sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w))
          and
          sum by (host) (increase(samoylove_site_http_response_count_total{path="/"}[6h] offset 1w)) > 50
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: traffic is five times lower than a week ago"

      # Время ответа самого сервера, из журнала nginx. Внешняя проба — это
      # ProbeLatencyHigh в infra.yml, она меряет ещё и сеть с TLS.
      - alert: SiteLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, host) (rate(samoylove_site_http_response_time_seconds_hist_bucket[15m]))) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: p95 response time above one second"

      - alert: AccessLogParseFailing
        # Формат журнала объявлен в deploy-kit, а строка разбора — в конфиге
        # экспортёра. Разойтись они могут молча: метрики просто перестанут
        # обновляться, и дашборд будет показывать ровную линию вместо правды.
        expr: increase(samoylove_site_parse_errors_total[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "nginx log lines are not parsed — log_format and exporter format have diverged"

  - name: product-chillhub
    rules:
      - alert: InstallFailureRateHigh
        # result!="ok" — это и ошибка, и отмена: пользователь, бросивший
        # установку на середине, для продукта тоже неудача.
        expr: |
          sum(increase(chillhub_game_installs_total{result!="ok"}[1h]))
            /
          clamp_min(sum(increase(chillhub_game_installs_total[1h])), 1) > 0.4
          and
          sum(increase(chillhub_game_installs_total[1h])) >= 5
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "More than 40% of installs in the last hour did not finish"

      - alert: DiffUpdatesNotWorking
        # Весь смысл лаунчера в том, что обновление скачивает изменившиеся
        # файлы. Если mode=full стал нормой, дифф не работает — например,
        # сборка пересобирается целиком и хеши не совпадают ни у кого.
        expr: |
          sum(increase(chillhub_game_updates_total{result="ok",mode="full"}[6h]))
            /
          clamp_min(sum(increase(chillhub_game_updates_total{result="ok"}[6h])), 1) > 0.8
          and
          sum(increase(chillhub_game_updates_total{result="ok"}[6h])) >= 5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Over 80% of updates downloaded the full build — diff savings are gone"

      - alert: HashMismatchesHigh
        # Единичное расхождение — обычно битый диск у одного пользователя.
        # Десяток за час означает, что не сходится сама сборка.
        expr: sum(increase(chillhub_hash_mismatches_total[1h])) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than ten files failed to match the manifest within an hour"

      - alert: LauncherErrorRateHigh
        expr: |
          sum(rate(chillhub_http_requests_total{code=~"5.."}[15m]))
            /
          clamp_min(sum(rate(chillhub_http_requests_total[15m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of launcher responses are 5xx"

      - alert: TelemetryRejected
        # Клиент шлёт события «выстрелил и забыл» и отказа не заметит. Рост
        # отклонений означает либо разъехавшийся контракт после выкатки
        # клиента, либо переполненный диск.
        expr: sum(increase(chillhub_telemetry_rejected_total[1h])) > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than 20 rejected calls to /metrics/report within an hour"

  - name: product-status
    rules:
      - alert: StatusAgentStale
        # Все метрики статус-страницы приходят из файла, который пишет агент.
        # Пока файл лежит, они выглядят здоровыми — «всё зелено, потому что
        # никто не смотрит» ловится только здесь.
        expr: time() - status_agent_run_timestamp_seconds > 600
        for: 5m
        labels:
          severity: critical
          source: textfile
        annotations:
          summary: "Status page agent has not polled services for over 10 minutes"

      - alert: StatusBotStale
        expr: time() - statusbot_heartbeat_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
          source: textfile
        annotations:
          summary: "Telegram bot has not updated its metrics for over 10 minutes"

      - alert: TelegramDeliveryFailing
        expr: increase(statusbot_send_failures_total[1h]) > 3
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Bot cannot send messages: incident notifications will not arrive"

  # Игра до сих пор была единственным сервисом вообще без правил: всё, что о
  # ней знал мониторинг, — жив ли юнит и отвечает ли сайт. Оба состояния ниже
  # выглядят снаружи полностью здоровыми, и увидеть их можно только по этим
  # двум метрикам.
  - name: product-snakes
    rules:
      - alert: SnakesProfilesReadOnly
        # Хранилище профилей ушло в read-only после неудачной загрузки:
        # сервер отвечает 200, игроки играют, счётчики растут — и весь
        # заработанный «Стиль» вместе с покупками пропадает на ближайшем
        # рестарте. Гейдж залипает в 1 до вмешательства оператора, поэтому
        # ждать здесь дольше нескольких минут нечего.
        expr: snakes_profiles_read_only == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Snakes profile storage is read-only — player progress will not survive a restart"

      - alert: SnakesProfileSavesFailing
        # Предвестник того же: автосейв не долетает до диска. Порог «хоть
        # одна ошибка за полчаса» — потерянное сохранение это уже потерянный
        # прогресс, усреднять тут нечего.
        expr: increase(snakes_profiles_save_errors_total[30m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Snakes cannot write profiles.json — progress is being lost"
