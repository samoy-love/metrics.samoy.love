# Конфигурация сбора метрик samoy.love.
#
# Интервал 30 с, а не 15: сервер один и маленький, а разрешение выше
# минутного здесь всё равно никто не смотрит.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    server: samoylove-oracle

# Правила алертинга здесь больше не живут: они переехали в Grafana
# (grafana/provisioning/alerting) вместе с маршрутизацией и доставкой в
# Telegram — там же, где раньше стоял отдельный Alertmanager. Этот Prometheus
# остаётся источником данных: у Grafana свой планировщик evaluation, ему
# rule_files и alerting-блок не нужны.

scrape_configs:
  # --- Сам Prometheus -------------------------------------------------------
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # --- Хост: CPU, память, диск, сеть, состояние systemd-юнитов --------------
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: samoylove-oracle

  # --- Grafana --------------------------------------------------------------
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # --- Приложения -----------------------------------------------------------
  # Snakes отдаёт метрики на хосте, порт 8090, в text exposition format —
  # переходников и relabel'а цель не требует.
  #
  # Порт 8090 — не игровой. Игра слушает 127.0.0.1, а на адресе docker-моста
  # (172.17.0.1, он же host.docker.internal) поднят ОТДЕЛЬНЫЙ слушатель,
  # отвечающий ровно по /metrics: METRICS_ADDR в /etc/snakes/snakes.env. Так
  # сбор не открывает контейнерам заодно /ws и статику мимо nginx с его
  # лимитами и заголовками.
  #
  # Само подключение разрешено на стороне snakes: базовый юнит режет сеть на
  # уровне ядра (IPAddressAllow=localhost, IPAddressDeny=any), а drop-in
  # deploy/systemd/snakes.service.d/10-metrics-scrape.conf добавляет к списку
  # подсети docker-мостов — 172.17.0.0/16 и сеть этого стека, 172.18.0.0/16.
  # Ограничение снято не целиком, а ровно под этот сбор: наружу сервис
  # по-прежнему закрыт, и обе подсети с сервера не маршрутизируются.
  - job_name: snakes
    static_configs:
      - targets: ["host.docker.internal:8090"]
        labels:
          instance: snakes

  # --- ChillHub -------------------------------------------------------------
  # Оба сервиса отдают метрики на СВОЁМ порту по /internal/metrics — отдельно
  # от API, который проксирует nginx. Это сделано затем, чтобы продуктовые
  # числа нельзя было открыть наружу забытым location.
  #
  # Адрес — docker-мост, а не 127.0.0.1: этот Prometheus живёт в контейнере,
  # в своём сетевом namespace, и до loopback хоста не достаёт. Сервисы поэтому
  # запускаются с *_METRICS_LISTEN_ADDR=172.17.0.1:*, см. docs/configuration.md
  # в репозитории лаунчера. Мост доступен только с хоста и его контейнеров.
  - job_name: chillhub-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["host.docker.internal:55701"]
        labels:
          instance: chillhub-api

  - job_name: chillhub-admin
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["host.docker.internal:55778"]
        labels:
          instance: chillhub-admin

  # --- Посещаемость статики -------------------------------------------------
  # Экспортёр журнала nginx: статика всех сайтов домена. Клиентских
  # счётчиков на этих сайтах нет и не будет — см. nginxlog/nginxlog.yml.
  - job_name: nginxlog
    static_configs:
      - targets: ["nginxlog-exporter:4040"]
        labels:
          instance: samoylove-oracle

  # --- Доступность сайтов ---------------------------------------------------
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://samoy.love/
          - https://metro.samoy.love/
          - https://launcher.samoy.love/
          - https://snakes.samoy.love/
          - https://status.samoy.love/
          - https://die.samoy.love/
    relabel_configs:
      # Классическая тройка для blackbox: адрес сайта уезжает в параметр
      # target, а сам запрос — в экспортёр. Без неё Prometheus пошёл бы
      # скрести сам сайт и получил бы HTML вместо метрик.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
