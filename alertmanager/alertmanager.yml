# Маршрутизация оповещений в Telegram.
#
# До этого файла 19 правил были списком того, что считается аварией, и не
# более: их состояние видно в /prometheus/alerts, то есть узнать о поломке мог
# только тот, кто сам открыл панель. Работает ровно до первой аварии ночью.
#
# ТОКЕН СЮДА НЕ ПИШЕТСЯ. bot_token_file указывает на файл, который лежит
# только на сервере (/opt/samoylove-metrics/telegram-bot-token, заводится
# server/bootstrap.sh) — рядом с .env Grafana и по той же причине: каталог
# релиза уезжает в артефакт выкатки, а секрету в артефакте делать нечего.
#
# chat_id, наоборот, здесь открыто. Это идентификатор, а не секрет: без токена
# он не даёт ничего, а адресат — владелец репозитория, чей телеграм и так
# указан в README.

global:
  # Через сколько молчания Prometheus алерт считается погасшим — на случай,
  # если замолчал сам Prometheus. Правила пересчитываются раз в 30 с, так что
  # пять минут это десять пропущенных циклов, а не сетевая икота.
  resolve_timeout: 5m

route:
  # Группировка по имени правила, а НЕ по инстансу: SiteDown при упавшем nginx
  # срабатывает сразу для шести доменов, и шесть отдельных сообщений об одной
  # аварии — это способ перестать читать чат.
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m

  # Получатель один: канал доставки и там и там тот же самый чат, отличается
  # только темп, а темп задаётся маршрутом. Два одинаковых receiver'а ради
  # разных заголовков разъехались бы при первой же правке шаблона.
  receiver: telegram
  repeat_interval: 24h

  routes:
    # critical — то, что чинят сейчас: недоступный сайт, мёртвый юнит,
    # кончающийся диск, теряющийся прогресс игроков.
    - matchers:
        - severity = "critical"
      receiver: telegram
      # Ждать группу дольше десяти секунд здесь нечего, а напоминание раз в
      # четыре часа — компромисс: реже забывается, чаще превращается в шум,
      # который однажды отключают вместе со всем остальным.
      group_wait: 10s
      repeat_interval: 4h

inhibit_rules:
  # Упавший сайт отвечает по таймауту, то есть probe_duration_seconds честно
  # больше трёх секунд — и вместе с SiteDown приходит ProbeLatencyHigh про то
  # же самое. Про медленный ответ мёртвого сайта знать нечего.
  - source_matchers:
      - alertname = "SiteDown"
    target_matchers:
      - alertname = "ProbeLatencyHigh"
    equal: [instance]

  # Общее правило: пока по цели горит critical, warning про неё же молчит.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, instance]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram-bot-token
        chat_id: 173418650
        parse_mode: HTML
        # Погасший алерт приходит тоже. Иначе после ночного «сайт упал» утром
        # неизвестно, поднялся он сам или лежит до сих пор.
        send_resolved: true
        # summary собирается из меток, а host среди них приходит из журнала
        # nginx, то есть в конечном счёте из интернета. `html` экранирует
        # угловые скобки и амперсанд: без этого Telegram отвечает 400 на
        # сломанной разметке, и авария уезжает в никуда вместе с сообщением.
        message: |-
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ if .CommonLabels.severity }}{{ .CommonLabels.severity | toUpper }}{{ else }}ALERT{{ end }}</b>{{ if eq .Status "resolved" }} — восстановлено{{ end }}
          {{ range .Alerts }}
          <b>{{ .Labels.alertname | html }}</b>{{ if .Labels.instance }} · {{ .Labels.instance | html }}{{ end }}
          {{ .Annotations.summary | html }}
          {{ end }}
          <a href="https://metrics.samoy.love/prometheus/alerts">Панель</a>
