name: Deploy

# Механика выкатки — в deploy-kit. Здесь только что катим и какой регресс
# обязан пройти.
#
# Триггер общий для всех проектов samoy.love: мерж в main уезжает на прод.
# До этого файла мониторинг был единственным хозяйством вообще без выкатки:
# его катали руками `git pull && docker compose up -d` в /opt/samoylove-metrics.
# То есть про наблюдателя за всеми сервисами нельзя было ответить ни «какая
# версия на проде», ни «что откатывать» — а он же и служит свидетелем по
# остальным.
#
# Пайплайн — static-site.yml, несмотря на имя: артефакт здесь не бинарь, а
# описание стека (compose-файл и конфиги), которое применяет перезапуск
# юнита-обёртки. UNIT из .deploy-kit/prod.env доезжает до preflight и
# release.sh; go-service.yml не подошёл бы — он требует go.mod, которого в
# этом репозитории нет.

on:
  push:
    branches: [main]
    paths-ignore:
      # Документация перечислена ПОИМЁННО, а не шаблоном '**.md'. Шаблон
      # здесь пока ничего не ломал — весь markdown репозитория лежит в корне
      # и в docs/, — но он ставил ловушку: BUILD_CMD увозит в релиз каталоги
      # целиком (`cp -r prometheus grafana blackbox nginxlog`), поэтому
      # ЛЮБОЙ файл внутри них едет на прод. Markdown, положенный в grafana/
      # или prometheus/, попадал бы в артефакт и при этом не запускал бы
      # выкатку вовсе: прод молча остался бы со старой копией. Ровно на этом
      # обжёгся samoy.love, где под '**.md' ушли исходники страниц.
      #
      # Ошибка «не выкатили нужное» дороже ошибки «выкатили лишнее», поэтому
      # правило простое: новый markdown по умолчанию катится, а в этот список
      # добавляется руками — и только заведомо документационный путь.
      # Соглашение из CLAUDE.md ровно эти три имени в корне и разрешает.
      - 'README.md'
      - 'README.*.md'
      - 'CLAUDE.md'
      # docs/ целиком: PNG дашбордов для README и render-dashboards.sh —
      # ручной инструмент съёмки, который запускают НА СЕРВЕРЕ. Ни то, ни
      # другое не входит ни в BUILD_CMD, ни в один гейт.
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Выкатка ходит на сервер по SSH
# секретами, токен ей нужен только для checkout — и для одной записи о
# выкатке.
#
# deployments: write — ради связи «коммит → выкатка». Deployment
# регистрируется на SHA, поэтому запись видна прямо на коммите и в разделе
# Environments репозитория. Для мониторинга это единственный такой ответ
# внутри GitHub: WRITE_VERSION_FILE=0, версии наружу нет, и «уехало ли это на
# прод» сейчас проверяется только глазами по симлинку current на сервере.
#
# Право задаётся ЗДЕСЬ, а не только в переиспользуемом workflow: вызываемый
# workflow не может иметь прав больше, чем дал ему вызывающий, и
# `permissions: contents: read` в этом файле молча срезал бы всё остальное.
# Обратное тоже верно — само по себе это право ничего не включает, шаг
# регистрации живёт в deploy-kit. Пока его там нет, строка просто не
# используется; когда появится, править вызовы уже не придётся.
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: Samoy-love/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/prod.env
      # Регресс тот же, что и в ci.yml, и это намеренно: конфиги мониторинга
      # ломаются молча — опечатка в правиле или разъехавшийся uid источника
      # данных ничего не роняют при выкатке, просто панель показывает пустоту,
      # а алерт никогда не срабатывает. Гейт обязан поймать это ДО прода.
      #
      # «Тот же» — это не «уже проверено на PR». CI считает проверки на
      # результате слияния ветки с main, каким он был в момент прогона; сюда
      # приезжает НАСТОЯЩИЙ main, в который за это время мог сесть ещё один
      # PR. Две ветки, каждая зелёная со своей базой, вместе дают красный
      # main — поймать это может только повторный прогон здесь.
      #
      # Именно поэтому проверка дашбордов стоит и тут. Раньше её тут не было,
      # хотя комментарий обещал «тот же регресс»: uid источника данных
      # сверялся только на PR, а grafana/dashboards уезжает в артефакт целиком
      # (`cp -r grafana`). Расхождение uid — тот самый молчаливый отказ, ради
      # которого весь этот блок и написан: панели показывают «No data», и
      # ничего при этом не падает.
      #
      # promtool берётся той же версии, что в docker-compose.yml: два места с
      # версией разъезжаются, одно — нет.
      #
      # Перед ним собирается временное дерево с заглушками: конфиг ссылается на
      # клиентский сертификат для метрик Incus и на file_sd с адресами целей, а
      # их в репозитории нет намеренно — первый это ключ, вторые описывают
      # устройство конкретной установки. promtool проверяет наличие таких
      # файлов на диске и без них валит проверку. Монтируется одно дерево
      # целиком: вложенное монтирование внутрь тома :ro докер создать не может.
      #
      # Правила алертинга и Alertmanager отсюда убраны: оба переехали в
      # Grafana (grafana/provisioning/alerting), проверять check rules и
      # amtool check-config больше не на чем — файлов, на которые они
      # смотрели, в репозитории не осталось. Готового CLI для схемы
      # провижининга Grafana под рукой нет, семантику этих трёх YAML этот
      # гейт не проверяет вовсе — см. README, раздел «Что гарантируется».
      #
      # ОТСТУП ВНУТРИ ЭТОГО БЛОКА ОБЯЗАН БЫТЬ ОДИНАКОВЫМ. В свёрнутом скаляре
      # YAML (>-) строка с бо́льшим отступом не сворачивается с предыдущей, а
      # остаётся отдельной. Продолжения команд были отбиты вправо «для
      # читаемости» — и список каталогов уехал от `yamllint` на свою строку,
      # то есть команда осталась без аргументов вовсе.
      gates: >-
        pipx install yamllint &&
        yamllint -d '{extends: relaxed, rules: {line-length: {max: 120}}}'
        prometheus blackbox nginxlog grafana/provisioning/dashboards
        grafana/provisioning/datasources .github &&
        yamllint -d '{extends: relaxed, rules: {line-length: disable}}' grafana/provisioning/alerting &&
        PROM=$(sed -n 's|.*image: prom/prometheus:\(v[0-9.]*\).*|\1|p' docker-compose.yml) &&
        test -n "$PROM" &&
        mkdir -p "$RUNNER_TEMP/pt/incus" "$RUNNER_TEMP/pt/targets" &&
        cp prometheus/prometheus.yml "$RUNNER_TEMP/pt/prometheus.yml" &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci
        -keyout "$RUNNER_TEMP/pt/incus/metrics.key"
        -out "$RUNNER_TEMP/pt/incus/metrics.crt" 2>/dev/null &&
        cp "$RUNNER_TEMP/pt/incus/metrics.crt" "$RUNNER_TEMP/pt/incus/server.crt" &&
        echo '[]' > "$RUNNER_TEMP/pt/targets/node-host.yml" &&
        echo '[]' > "$RUNNER_TEMP/pt/targets/incus.yml" &&
        docker run --rm --entrypoint promtool -v "$RUNNER_TEMP/pt:/etc/prometheus:ro"
        prom/prometheus:$PROM check config /etc/prometheus/prometheus.yml &&
        DSUID=$(sed -n 's/^ *uid: *//p' grafana/provisioning/datasources/prometheus.yml) &&
        test -n "$DSUID" &&
        for f in grafana/dashboards/*.json; do
        jq -e . "$f" > /dev/null || { echo "::error::$f не разбирается как JSON"; exit 1; };
        BAD=$(jq -r --arg uid "$DSUID"
        '[.. | objects | select(has("uid") and has("type") and .type == "prometheus") | .uid]
        | unique | map(select(. != $uid)) | join(", ")' "$f");
        test -z "$BAD" || { echo "::error::$f: чужие uid источника данных: $BAD (ожидался $DSUID)"; exit 1; };
        done &&
        sudo install -D -m 644 .env.example /opt/samoylove-metrics/.env &&
        docker compose config --quiet
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
