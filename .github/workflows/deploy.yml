name: Deploy

# Механика выкатки — в deploy-kit. Здесь только что катим и какой регресс
# обязан пройти.
#
# Триггер общий для всех проектов samoy.love: мерж в main уезжает на прод.
# До этого файла мониторинг был единственным хозяйством вообще без выкатки:
# его катали руками `git pull && docker compose up -d` в /opt/samoylove-metrics.
# То есть про наблюдателя за всеми сервисами нельзя было ответить ни «какая
# версия на проде», ни «что откатывать» — а он же и служит свидетелем по
# остальным.
#
# Пайплайн — static-site.yml, несмотря на имя: артефакт здесь не бинарь, а
# описание стека (compose-файл и конфиги), которое применяет перезапуск
# юнита-обёртки. UNIT из .deploy-kit/prod.env доезжает до preflight и
# release.sh; go-service.yml не подошёл бы — он требует go.mod, которого в
# этом репозитории нет.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Выкатка ходит на сервер по SSH
# секретами, токен ей нужен только для checkout.
permissions:
  contents: read

jobs:
  deploy:
    uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/prod.env
      # Регресс тот же, что и в ci.yml, и это намеренно: конфиги мониторинга
      # ломаются молча — опечатка в правиле или разъехавшийся uid источника
      # данных ничего не роняют при выкатке, просто панель показывает пустоту,
      # а алерт никогда не срабатывает. Гейт обязан поймать это ДО прода.
      #
      # promtool берётся той же версии, что в docker-compose.yml: два места с
      # версией разъезжаются, одно — нет.
      #
      # ОТСТУП ВНУТРИ ЭТОГО БЛОКА ОБЯЗАН БЫТЬ ОДИНАКОВЫМ. В свёрнутом скаляре
      # YAML (>-) строка с бо́льшим отступом не сворачивается с предыдущей, а
      # остаётся отдельной. Продолжения команд были отбиты вправо «для
      # читаемости» — и список каталогов уехал от `yamllint` на свою строку,
      # то есть команда осталась без аргументов вовсе.
      gates: >-
        pipx install yamllint &&
        yamllint -d '{extends: relaxed, rules: {line-length: {max: 120}}}'
        prometheus blackbox nginxlog grafana/provisioning .github &&
        PROM=$(sed -n 's|.*image: prom/prometheus:\(v[0-9.]*\).*|\1|p' docker-compose.yml) &&
        test -n "$PROM" &&
        docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus:ro"
        prom/prometheus:$PROM check config /etc/prometheus/prometheus.yml &&
        docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus:ro"
        prom/prometheus:$PROM check rules /etc/prometheus/rules/product.yml /etc/prometheus/rules/infra.yml &&
        sudo install -D -m 644 .env.example /opt/samoylove-metrics/.env &&
        docker compose config --quiet
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
