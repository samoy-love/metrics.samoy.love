# Конфиги здесь ломаются молча: опечатка в правиле или разъехавшийся uid
# источника данных не роняют ничего при выкатке — просто панель показывает
# пустоту, а алерт никогда не срабатывает. Поэтому проверки простые, но есть.

name: CI

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

# Минимальные права для GITHUB_TOKEN: CI только читает код.
permissions:
  contents: read

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  check:
    name: Проверка конфигов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Синтаксис YAML
        run: |
          pipx install yamllint
          # grafana/provisioning/alerting исключён из проверки длины строки:
          # шаблон сообщения в contactpoints.yml и PromQL-выражения в
          # rules.yml — цельные строки, переносить их нельзя, перенос уедет
          # либо в текст сообщения, либо в саму формулу.
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 120}}}' \
            prometheus blackbox nginxlog grafana/provisioning/dashboards \
            grafana/provisioning/datasources .github
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' grafana/provisioning/alerting

      # Версия promtool берётся из docker-compose.yml, а не пишется здесь
      # отдельно: два места с версией разъезжаются, одно — нет.
      - name: Версия Prometheus из compose
        id: prom
        run: |
          version=$(sed -n 's|.*image: prom/prometheus:\(v[0-9.]*\).*|\1|p' docker-compose.yml)
          test -n "$version" || { echo "не нашёл версию prometheus в docker-compose.yml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Правила алертинга больше не в этих файлах — они переехали в Grafana
      # (grafana/provisioning/alerting), у promtool там проверять нечего.
      # Синтаксис самого prometheus.yml (цели, интервалы) он всё ещё видит.
      - name: Проверка конфигурации Prometheus
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:${{ steps.prom.outputs.version }} \
            check config /etc/prometheus/prometheus.yml

      # НЕТ семантической проверки rules.yml/contactpoints.yml/policies.yml:
      # promtool и amtool разбирают формат Prometheus/Alertmanager, а не схему
      # провижининга Grafana, и готового CLI для неё под рукой нет. yamllint
      # выше ловит только синтаксис YAML — опечатка в поле схемы (например,
      # неверный тип узла threshold) обнаружится лишь при старте Grafana.
      # Именно поэтому перед выкаткой стоит поднять стек и проверить
      # /alerting/list в UI, а не полагаться на зелёный CI как на полную
      # гарантию.
      - name: Проверка docker-compose
        run: |
          # env_file указывает на файл рядом с каталогом релизов, а не в
          # рабочем дереве: секрет не должен уезжать в артефакт выкатки.
          # Раннеру подкладываем образец по тому же пути — иначе `config`
          # честно упадёт на отсутствующем файле.
          # 644, а не 600: файл читает docker compose от имени пользователя
          # раннера. Секретов в нём нет — это образец с плейсхолдерами.
          sudo install -D -m 644 .env.example /opt/samoylove-metrics/.env
          docker compose config --quiet

      # Дашборд провижинится из файла, и если uid источника данных в нём не
      # совпадёт с провижинингом, все панели молча покажут «No data».
      - name: Дашборды и uid источника данных
        run: |
          uid=$(sed -n 's/^ *uid: *//p' grafana/provisioning/datasources/prometheus.yml)
          test -n "$uid" || { echo "не нашёл uid источника данных"; exit 1; }
          for f in grafana/dashboards/*.json; do
            jq -e . "$f" > /dev/null || { echo "$f: не разбирается как JSON"; exit 1; }
            bad=$(jq -r --arg uid "$uid" \
              '[.. | objects | select(has("uid") and has("type") and .type == "prometheus") | .uid]
               | unique | map(select(. != $uid)) | join(", ")' "$f")
            test -z "$bad" || { echo "$f: чужие uid источника данных: $bad (ожидался $uid)"; exit 1; }
          done

  # Переименование или слияние задач CI не красит прогон в красный — красной
  # становится защита ветки, и только через день, на СЛЕДУЮЩЕМ PR: main ждёт
  # проверку по старому имени вечно, а "Merge" молчит о причине. Руками это
  # правится в Settings → Branches, но руками же и забывается.
  #
  # GITHUB_TOKEN сюда не годится: у него в принципе нет permission scope для
  # чтения защиты ветки (полный список — actions, artifact-metadata,
  # attestations, checks, contents, deployments, discussions, id-token,
  # issues, models, packages, pages, pull-requests, repository-projects,
  # security-events, statuses; administration среди них нет, хотя REST API и
  # называет его так). Отсюда PROTECTION_READ_TOKEN — fine-grained PAT на
  # metrics.samoy.love с двумя правами: Administration: Read-only (список
  # обязательных проверок) и Actions: Read-only (список задач текущего
  # прогона — тем же токеном читаются обе стороны сравнения). Лежит в secrets
  # репозитория и передаётся только этому шагу, а не всей задаче.
  protection-sync:
    name: Защита ветки соответствует задачам CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Сверить задачи с обязательными проверками main
        env:
          GH_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
          SELF_JOB_NAME: Защита ветки соответствует задачам CI
        run: bash ci/branch-protection-check.sh
