# Экспортёр журнала доступа nginx: посещаемость статики samoy.love и metro.
#
# ---------------------------------------------------------------------------
# ПОЧЕМУ ИМЕННО ЭТОТ ЭКСПОРТЁР
# ---------------------------------------------------------------------------
# Кандидатов было три.
#
#   nginx-prometheus-exporter (официальный) читает stub_status: активные
#   соединения и суммарное число запросов на весь сервер. Ни домена, ни пути,
#   ни кода ответа, ни времени — на вопрос «сколько человек зашло на metro и
#   не выросли ли пятисотки» он не отвечает вовсе.
#
#   mtail умеет всё, но ценой своего языка программирования: на каждую метрику
#   пишется программа, и сопровождать это ради пяти счётчиков избыточно.
#
#   prometheus-nginxlog-exporter разбирает журнал по строке log_format —
#   ровно то, что нужно, и ровно столько. Есть готовый образ под arm64
#   (проверено docker manifest inspect: linux/arm64 в манифесте есть), что для
#   этого сервера обязательное условие.
#
# ---------------------------------------------------------------------------
# ПЕРСОНАЛЬНЫЕ ДАННЫЕ
# ---------------------------------------------------------------------------
# Экспортёр читает НЕ обычный журнал доступа, а отдельный samoy_metrics.log,
# в котором IP, User-Agent и Referer отсутствуют физически (формат объявлен в
# deploy-kit/nginx/conf.d/samoy-log-metrics.conf). Это не только вопрос меток:
# процесс, который никогда не видел персональных данных, не может их случайно
# опубликовать.
#
# ---------------------------------------------------------------------------
# КАРДИНАЛЬНОСТЬ
# ---------------------------------------------------------------------------
# Путь и домен приходят из запроса, то есть из интернета. Без ограничения
# любой сканер, перебирающий /wp-admin, /.env и тысячу подобных, за ночь
# создал бы тысячу временных рядов, и эта тысяча осталась бы в TSDB навсегда.
# Поэтому домен ограничен списком, а путь сведён к четырём значениям. Всё
# остальное складывается в "other" — «сколько стучится мимо» тоже полезное
# число, лишь бы оно было одним рядом, а не тысячей.

listen:
  # Порт слушается только внутри сети compose: в docker-compose.yml у этого
  # сервиса нет секции ports, то есть наружу он не опубликован. Ходит сюда
  # один Prometheus, по имени сервиса.
  port: 4040
  address: "0.0.0.0"
  metrics_endpoint: "/metrics"

namespaces:
  - name: samoy_site
    # Порядок полей ОБЯЗАН совпадать с log_format samoy_metrics в deploy-kit.
    # Расхождение не роняет ни nginx, ни экспортёр: метрики просто перестают
    # появляться, поэтому оба места правятся одной правкой.
    format: '$host "$request" $status $body_bytes_sent $request_time'
    source:
      files:
        - /var/log/nginx/samoy_metrics.log
    # Статика отдаётся с того же хоста, поэтому интересны первые доли секунды;
    # верхняя граница 5 с нужна только чтобы поймать «что-то совсем не так».
    histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
    relabel_configs:
      # Домен: список закрыт, всё прочее (запросы по IP, чужие Host-заголовки
      # от сканеров) сворачивается экспортёром в "other".
      - target_label: host
        from: host
        whitelist:
          - samoy.love
          - www.samoy.love
          - metro.samoy.love

      # Путь: из "GET /path HTTP/1.1" берётся второй элемент и сводится к
      # четырём значениям. Последнее правило — обязательный «всё остальное»:
      # если не совпало ни одно, экспортёр ставит ПУСТУЮ строку, и метка
      # молча теряет смысл.
      - target_label: path
        from: request
        split: 2
        matches:
          - regexp: "^/$"
            replacement: "/"
          - regexp: "^/_astro/.*$"
            replacement: "/_astro/"
          - regexp: '^.*\.(css|js|mjs|map|png|jpg|jpeg|webp|avif|gif|svg|ico|woff2?|ttf|eot)(\?.*)?$'
            replacement: "static"
          - regexp: "^.*$"
            replacement: "other"
